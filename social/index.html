ur (human capital) increases efficiency, and capital goods support labour.", "Human capital includes skills, knowledge and health. It raises productivity and quality, supports innovation and leads to economic growth.", "Human capital is built through education, vocational training, health care, and platforms like SWAYAM and National Career Service.", "Without skilled workers, businesses face low productivity, poor quality, delays, higher training costs, and loss of customers and profit."], "topics": [{"id": "e1", "title": "1. What are the Factors of Production?", "blocks": [{"p": "The factors of production include:", "a": ["e1-0"]}, {"ul": ["Land: Natural resource like soil and water.", "Labour: Human physical and mental effort.", "Capital: Man-made tools, machinery, finance used in production.", "Entrepreneurship: The ability to organise the other three and take risk for profit."], "a": [["e1-1"], ["e1-2"], ["e1-3"], ["e1-4"]]}]}, {"id": "e2", "title": "2. How do these factors relate and support each other?", "blocks": [{"p": "Entrepreneurs bring together land, labour, and capital to produce goods.", "a": ["e2-0"]}, {"p": "Skilled labour (human capital) increases worker efficiency, and capital goods support labour.", "a": ["e2-1"]}]}, {"id": "e3", "title": "3. What is the role of human capital in production, and what are its factors?", "blocks": [{"p": "Human capital includes skills, knowledge, and health, which enhances productivity.", "a": ["e3-0"]}, {"p": "These factors help in increasing efficiency and output quality, supporting innovation, leading to economic growth.", "a": ["e3-1"]}, {"p": "It is built through education and vocational training, health care, and platforms like SWAYAM and National Career Service.", "a": ["e3-2"]}]}, {"id": "e4", "title": "4. What problems could businesses face if they do not find workers with required skills?", "blocks": [{"p": "When businesses cannot find skilled workers, they face:", "a": ["e4-0"]}, {"ul": ["Low productivity.", "Poor quality products or services.", "Delays, increased training costs, loss of customers and profit."], "a": [["e4-1"], ["e4-2"], ["e4-3"]]}, {"p": "Skilled workers are essential for business growth and competition.", "a": ["e4-4"]}]}], "quiz": [{"topic": "e1", "type": "mcq", "q": "What are the four factors of production?", "a": "Land, labour, capital and entrepreneurship", "opts": ["Land, labour, capital and entrepreneurship", "Land, water, air and fire", "Money, gold, silver and shares", "Shops, markets, banks and schools"], "id": "eco-q0"}, {"topic": "e1", "type": "mcq", "q": "Soil and water are examples of ____.", "a": "Land", "opts": ["Land", "Labour", "Capital", "Entrepreneurship"], "id": "eco-q1"}, {"topic": "e1", "type": "mcq", "q": "Human physical and mental effort is called ____.", "a": "Labour", "opts": ["Labour", "Land", "Capital", "Entrepreneurship"], "id": "eco-q2"}, {"topic": "e1", "type": "mcq", "q": "Man-made tools, machinery and finance used in production are ____.", "a": "Capital", "opts": ["Capital", "Land", "Labour", "Entrepreneurship"], "id": "eco-q3"}, {"topic": "e1", "type": "mcq", "q": "The ability to organise the other three factors and take risk for profit is ____.", "a": "Entrepreneurship", "opts": ["Entrepreneurship", "Labour", "Capital", "Land"], "id": "eco-q4"}, {"topic": "e1", "type": "tf", "q": "Capital includes finance used in production.", "a": "True", "opts": ["True", "False"], "id": "eco-q5"}, {"topic": "e2", "type": "mcq", "q": "Who brings together land, labour and capital?", "a": "Entrepreneurs", "opts": ["Entrepreneurs", "Customers", "Tourists", "Students"], "id": "eco-q6"}, {"topic": "e2", "type": "tf", "q": "Capital goods support labour, and skilled labour increases worker efficiency.", "a": "True", "opts": ["True", "False"], "id": "eco-q7"}, {"topic": "e3", "type": "mcq", "q": "Human capital includes ____.", "a": "Skills, knowledge and health", "opts": ["Skills, knowledge and health", "Land and water", "Machines and tools", "Money and gold"], "id": "eco-q8"}, {"topic": "e3", "type": "mcq", "q": "Which platforms help build human capital (from your notes)?", "a": "SWAYAM and National Career Service", "opts": ["SWAYAM and National Career Service", "Hundi and Iqta", "Mansabdari and Jagir", "Kaveri and Panipat"], "id": "eco-q9"}, {"topic": "e3", "type": "tf", "q": "Human capital supports innovation, leading to economic growth.", "a": "True", "opts": ["True", "False"], "id": "eco-q10"}, {"topic": "e3", "type": "mcq", "q": "Human capital is built through ____.", "a": "Education, vocational training and health care", "opts": ["Education, vocational training and health care", "Mining and drilling", "Cutting forests", "Free electricity"], "id": "eco-q11"}, {"topic": "e3", "type": "mcq", "q": "Human capital ____ productivity.", "a": "Enhances", "opts": ["Enhances", "Reduces", "Stops", "Has no effect on"], "id": "eco-q12"}, {"topic": "e4", "type": "mcq", "q": "If businesses cannot find skilled workers, they face ____.", "a": "Low productivity and poor quality", "opts": ["Low productivity and poor quality", "More profit", "More customers", "Faster work"], "id": "eco-q13"}, {"topic": "e4", "type": "tf", "q": "A lack of skilled workers can cause delays, higher training costs and loss of customers and profit.", "a": "True", "opts": ["True", "False"], "id": "eco-q14"}, {"topic": "e4", "type": "tf", "q": "Skilled workers are not needed for business growth and competition.", "a": "False", "opts": ["True", "False"], "id": "eco-q15"}], "match": [{"title": "Factor ↔ Meaning", "left": "Factor", "right": "Meaning", "pairs": [["Land", "Natural resources like soil and water"], ["Labour", "Human physical and mental effort"], ["Capital", "Man-made tools, machinery, finance"], ["Entrepreneurship", "Organise the other three and take risk for profit"], ["Human capital", "Skills, knowledge and health"]]}], "sort": [{"title": "Which factor of production?", "buckets": ["🌱 Land", "💪 Labour", "🛠️ Capital", "💡 Entrepreneur"], "items": [["Soil", 0], ["Water", 0], ["Physical effort", 1], ["Mental effort", 1], ["Tools", 2], ["Machinery", 2], ["Finance", 2], ["Organising the other three", 3], ["Taking risk for profit", 3]]}, {"title": "Problem or Solution?", "buckets": ["⚠️ Problem (no skilled workers)", "✅ Builds human capital"], "items": [["Low productivity", 0], ["Poor quality products", 0], ["Delays", 0], ["Loss of customers and profit", 0], ["Education", 1], ["Vocational training", 1], ["Health care", 1], ["SWAYAM", 1], ["National Career Service", 1]]}], "order": [], "flash": [["Land", "Natural resources like soil and water."], ["Labour", "Human physical and mental effort."], ["Capital", "Man-made tools, machinery, finance used in production."], ["Entrepreneurship", "Ability to organise land, labour and capital and take risk for profit."], ["Human capital", "Skills, knowledge and health → more productivity, quality, innovation, growth."], ["How to build human capital", "Education, vocational training, health care, SWAYAM, National Career Service."], ["No skilled workers →", "Low productivity, poor quality, delays, training costs, loss of customers and profit."]], "summaryAudio": [["eco-s0"], ["eco-s1"], ["eco-s2"], ["eco-s3"], ["eco-s4"], ["eco-s5"], ["eco-s6"]]}, {"id": "pol", "subject": "Politics", "title": "Chapter 5: Universal Franchise & India's Electoral System", "short": "Ch 5 · Universal Franchise", "emoji": "🗳️", "c1": "#0077b6", "c2": "#023e8a", "summary": ["Universal Franchise is guaranteed under Article 326 of the Constitution. It reflects equality, participation and representation.", "The voting age was lowered from 21 to 18 in 1988. Every citizen must register as a voter in their constituency; people with certain criminal records are barred.", "Universal Franchise gives everyone an equal political voice, lets people choose representatives, promotes participation and accountability, and bridges caste, class and gender barriers.", "The Election Commission of India (ECI) was established in 1950 under Article 324. It is an independent constitutional authority.", "The ECI conducts elections to Lok Sabha, Rajya Sabha, State Assemblies, President and Vice President; updates electoral rolls; registers parties and allots symbols; enforces the MCC; oversees counting and results.", "An electoral roll is the official list of all eligible voters in a constituency.", "The Model Code of Conduct (MCC) is a set of ECI rules for free, fair and peaceful elections: no misuse of government power, no new schemes, no government resources, no hate speech, gifts or cash, and officials must not campaign.", "India has a parliamentary system with direct and indirect elections at national, state and local levels.", "First-Past-The-Post is used for Lok Sabha and State Assembly elections; Single Transferable Vote for Rajya Sabha and Presidential elections.", "Parliament has two houses: Rajya Sabha (Council of States, Upper House, 245 members: 233 elected by MLAs and 12 nominated by the President) and Lok Sabha (House of People, Lower House, not more than 550 members)."], "topics": [{"id": "p1", "title": "1. Universal Franchise: a cornerstone of Indian democracy", "blocks": [{"ul": ["Guaranteed under Article 326 of the Indian Constitution.", "Reflects equality, participation and representation in a democracy.", "Voting age was lowered from 21 to 18 in 1988.", "Bridges barriers such as caste, class and gender.", "Every Indian citizen must register as a voter in their constituency.", "Individuals with certain criminal records are barred from voting."], "a": [["p1-0"], ["p1-1"], ["p1-2"], ["p1-3"], ["p1-4"], ["p1-5"]]}]}, {"id": "p2", "title": "2. Importance of Universal Franchise", "blocks": [{"ul": ["Ensures equal political voice.", "Empowers the people to choose their representative.", "Promotes civic participation and accountability.", "Bridges barriers (such as caste, class and gender).", "Ensures that representatives are answerable to the people."], "a": [["p2-0"], ["p2-1"], ["p2-2"], ["p2-3"], ["p2-4"]]}]}, {"id": "p3", "title": "3. Election Commission of India (ECI)", "blocks": [{"p": "Established: in 1950 under Article 324 of the Constitution.", "a": ["p3-0"]}, {"p": "Nature: Independent constitutional authority.", "a": ["p3-1"]}, {"h": "Functions"}, {"ul": ["Conducts elections to Lok Sabha, Rajya Sabha, State Assemblies, and the offices of President & Vice President.", "Prepares and updates electoral rolls.", "Registers political parties and allots election symbols.", "Enforces the Model Code of Conduct (MCC).", "Oversees counting and result declaration."], "a": [["p3-2"], ["p3-3"], ["p3-4"], ["p3-5"], ["p3-6"]]}, {"p": "Electoral Roll: Official list of all eligible voters in a constituency.", "a": ["p3-7"]}]}, {"id": "p4", "title": "4. Model Code of Conduct (MCC)", "blocks": [{"p": "A set of rules issued by the ECI to ensure free, fair and peaceful elections.", "a": ["p4-0"]}, {"h": "Main Guidelines"}, {"ul": ["Prevents misuse of government power during elections.", "No new schemes can be announced by the ruling party.", "No use of government resources for election purposes.", "No hate speech, gifts or cash to influence voters.", "Government officials must not campaign for any party.", "Violations are punishable and monitored by the ECI."], "a": [["p4-1"], ["p4-2"], ["p4-3"], ["p4-4"], ["p4-5"], ["p4-6"]]}]}, {"id": "p5", "title": "5. How does India's electoral system work?", "blocks": [{"ul": ["Parliamentary system with direct and indirect elections, allowing citizens to participate at national, state and local levels.", "Uses the First-Past-The-Post system for Lok Sabha and State Assembly elections.", "Uses the Single Transferable Vote system for Rajya Sabha and Presidential elections.", "The ECI conducts elections at national and state levels."], "a": [["p5-0"], ["p5-1"], ["p5-2"], ["p5-3"]]}]}, {"id": "p6", "title": "6. Parliament of India", "blocks": [{"ul": ["Divided into two houses: Council of States (Rajya Sabha) and House of People (Lok Sabha).", "Rajya Sabha is the Upper House; Lok Sabha is the Lower House.", "Rajya Sabha has 245 members (233 elected by MLAs, 12 nominated by the President).", "Lok Sabha has not more than 550 members."], "a": [["p6-0"], ["p6-1"], ["p6-2"], ["p6-3"]]}]}], "quiz": [{"topic": "p1", "type": "mcq", "q": "Universal Franchise is guaranteed under Article ____.", "a": "326", "opts": ["326", "324", "21", "18"], "id": "pol-q0"}, {"topic": "p1", "type": "mcq", "q": "In 1988 the voting age was lowered from ____.", "a": "21 to 18", "opts": ["21 to 18", "25 to 21", "18 to 16", "30 to 21"], "id": "pol-q1"}, {"topic": "p1", "type": "fill", "q": "Universal Franchise reflects equality, participation and ____.", "a": "representation", "opts": ["representation", "taxation", "punishment", "competition"], "id": "pol-q2"}, {"topic": "p1", "type": "mcq", "q": "Universal Franchise bridges barriers such as ____.", "a": "Caste, class and gender", "opts": ["Caste, class and gender", "Rivers and mountains", "Rain and drought", "Roads and bridges"], "id": "pol-q3"}, {"topic": "p1", "type": "tf", "q": "Every Indian citizen must register as a voter in their constituency.", "a": "True", "opts": ["True", "False"], "id": "pol-q4"}, {"topic": "p1", "type": "tf", "q": "People with certain criminal records are barred from voting.", "a": "True", "opts": ["True", "False"], "id": "pol-q5"}, {"topic": "p2", "type": "mcq", "q": "Which is an importance of Universal Franchise?", "a": "Ensures equal political voice", "opts": ["Ensures equal political voice", "Only rich people can vote", "Removes elections", "Only men can vote"], "id": "pol-q6"}, {"topic": "p2", "type": "tf", "q": "Universal Franchise ensures that representatives are answerable to the people.", "a": "True", "opts": ["True", "False"], "id": "pol-q7"}, {"topic": "p2", "type": "mcq", "q": "Universal Franchise empowers people to ____.", "a": "Choose their representative", "opts": ["Choose their representative", "Avoid paying tax", "Make their own laws alone", "Skip school"], "id": "pol-q8"}, {"topic": "p2", "type": "fill", "q": "Universal Franchise promotes civic participation and ____.", "a": "accountability", "opts": ["accountability", "corruption", "violence", "laziness"], "id": "pol-q9"}, {"topic": "p3", "type": "mcq", "q": "The Election Commission of India was established in ____.", "a": "1950", "opts": ["1950", "1947", "1988", "1974"], "id": "pol-q10"}, {"topic": "p3", "type": "mcq", "q": "The ECI was set up under Article ____.", "a": "324", "opts": ["324", "326", "370", "21"], "id": "pol-q11"}, {"topic": "p3", "type": "mcq", "q": "What is the nature of the ECI?", "a": "Independent constitutional authority", "opts": ["Independent constitutional authority", "A political party", "A private company", "A state police force"], "id": "pol-q12"}, {"topic": "p3", "type": "mcq", "q": "An electoral roll is ____.", "a": "The official list of all eligible voters in a constituency", "opts": ["The official list of all eligible voters in a constituency", "A list of political parties", "A list of election results", "A list of ministers"], "id": "pol-q13"}, {"topic": "p3", "type": "mcq", "q": "Who registers political parties and allots election symbols?", "a": "Election Commission of India", "opts": ["Election Commission of India", "The Prime Minister", "The Supreme Court", "Rajya Sabha"], "id": "pol-q14"}, {"topic": "p3", "type": "tf", "q": "The ECI conducts elections for the offices of President and Vice President.", "a": "True", "opts": ["True", "False"], "id": "pol-q15"}, {"topic": "p3", "type": "tf", "q": "The ECI oversees counting and result declaration.", "a": "True", "opts": ["True", "False"], "id": "pol-q16"}, {"topic": "p4", "type": "mcq", "q": "The Model Code of Conduct is issued by ____.", "a": "The ECI", "opts": ["The ECI", "The ruling party", "The Lok Sabha", "The President"], "id": "pol-q17"}, {"topic": "p4", "type": "mcq", "q": "The MCC ensures elections are ____.", "a": "Free, fair and peaceful", "opts": ["Free, fair and peaceful", "Quick and secret", "Only online", "Held every year"], "id": "pol-q18"}, {"topic": "p4", "type": "tf", "q": "Under the MCC, the ruling party can announce new schemes during elections.", "a": "False", "opts": ["True", "False"], "id": "pol-q19"}, {"topic": "p4", "type": "tf", "q": "Government officials must not campaign for any party.", "a": "True", "opts": ["True", "False"], "id": "pol-q20"}, {"topic": "p4", "type": "mcq", "q": "Which is NOT allowed under the MCC?", "a": "Giving gifts or cash to voters", "opts": ["Giving gifts or cash to voters", "Voting peacefully", "Counting votes", "Registering as a voter"], "id": "pol-q21"}, {"topic": "p4", "type": "tf", "q": "Violations of the MCC are punishable and monitored by the ECI.", "a": "True", "opts": ["True", "False"], "id": "pol-q22"}, {"topic": "p5", "type": "mcq", "q": "Which system is used for Lok Sabha and State Assembly elections?", "a": "First-Past-The-Post", "opts": ["First-Past-The-Post", "Single Transferable Vote", "Lottery system", "Nomination only"], "id": "pol-q23"}, {"topic": "p5", "type": "mcq", "q": "Which system is used for Rajya Sabha and Presidential elections?", "a": "Single Transferable Vote", "opts": ["Single Transferable Vote", "First-Past-The-Post", "Lottery system", "Hand raising"], "id": "pol-q24"}, {"topic": "p5", "type": "mcq", "q": "India has a ____ system with direct and indirect elections.", "a": "Parliamentary", "opts": ["Parliamentary", "Presidential", "Monarchy", "Military"], "id": "pol-q25"}, {"topic": "p5", "type": "tf", "q": "Citizens can participate in elections at national, state and local levels.", "a": "True", "opts": ["True", "False"], "id": "pol-q26"}, {"topic": "p6", "type": "mcq", "q": "The Upper House of Parliament is ____.", "a": "Rajya Sabha (Council of States)", "opts": ["Rajya Sabha (Council of States)", "Lok Sabha (House of People)", "State Assembly", "Panchayat"], "id": "pol-q27"}, {"topic": "p6", "type": "mcq", "q": "The Lower House of Parliament is ____.", "a": "Lok Sabha (House of People)", "opts": ["Lok Sabha (House of People)", "Rajya Sabha (Council of States)", "Supreme Court", "Vidhan Parishad"], "id": "pol-q28"}, {"topic": "p6", "type": "mcq", "q": "How many members does the Rajya Sabha have?", "a": "245", "opts": ["245", "550", "233", "12"], "id": "pol-q29"}, {"topic": "p6", "type": "mcq", "q": "How many Rajya Sabha members are nominated by the President?", "a": "12", "opts": ["12", "233", "245", "18"], "id": "pol-q30"}, {"topic": "p6", "type": "mcq", "q": "The 233 elected members of Rajya Sabha are elected by ____.", "a": "MLAs", "opts": ["MLAs", "All citizens directly", "The President", "The ECI"], "id": "pol-q31"}, {"topic": "p6", "type": "fill", "q": "Lok Sabha has not more than ____ members.", "a": "550", "opts": ["550", "245", "233", "326"], "id": "pol-q32"}], "match": [{"title": "Number ↔ Fact", "left": "Number", "right": "Fact", "pairs": [["Article 326", "Universal Franchise"], ["Article 324", "Election Commission of India"], ["1950", "ECI established"], ["1988", "Voting age lowered to 18"], ["245", "Members of Rajya Sabha"], ["12", "Rajya Sabha members nominated by President"], ["233", "Rajya Sabha members elected by MLAs"], ["550", "Maximum members of Lok Sabha"]]}, {"title": "Term ↔ Meaning", "left": "Term", "right": "Meaning", "pairs": [["Universal Franchise", "Right to vote for every adult citizen"], ["Electoral roll", "Official list of eligible voters"], ["MCC", "ECI rules for free, fair, peaceful elections"], ["Rajya Sabha", "Council of States, Upper House"], ["Lok Sabha", "House of People, Lower House"]]}], "sort": [{"title": "Lok Sabha or Rajya Sabha?", "buckets": ["🏛️ Lok Sabha", "🏛️ Rajya Sabha"], "items": [["House of People", 0], ["Lower House", 0], ["Not more than 550 members", 0], ["First-Past-The-Post elections", 0], ["Council of States", 1], ["Upper House", 1], ["245 members", 1], ["12 nominated by the President", 1], ["Single Transferable Vote", 1]]}, {"title": "ECI function or MCC rule?", "buckets": ["🗳️ ECI function", "📜 MCC rule"], "items": [["Prepares electoral rolls", 0], ["Registers political parties", 0], ["Allots election symbols", 0], ["Oversees counting and results", 0], ["No new schemes by ruling party", 1], ["No hate speech, gifts or cash", 1], ["No government resources for elections", 1], ["Officials must not campaign", 1]]}, {"title": "Which voting system?", "buckets": ["🥇 First-Past-The-Post", "🔢 Single Transferable Vote"], "items": [["Lok Sabha", 0], ["State Assembly", 0], ["Rajya Sabha", 1], ["President", 1]]}], "order": [], "flash": [["Universal Franchise", "Article 326; equality, participation, representation; voting age 21 → 18 in 1988."], ["Importance of franchise", "Equal voice, choose representatives, participation, accountability, bridges caste/class/gender."], ["ECI", "Est. 1950 under Article 324; independent constitutional authority."], ["ECI functions", "Conducts elections, electoral rolls, registers parties & symbols, enforces MCC, counting & results."], ["Electoral roll", "Official list of all eligible voters in a constituency."], ["MCC", "ECI rules: no misuse of power, no new schemes, no govt resources, no hate speech/gifts/cash, officials don't campaign."], ["First-Past-The-Post", "Lok Sabha and State Assembly elections."], ["Single Transferable Vote", "Rajya Sabha and Presidential elections."], ["Rajya Sabha", "Council of States, Upper House, 245 members (233 by MLAs + 12 nominated)."], ["Lok Sabha", "House of People, Lower House, not more than 550 members."]], "summaryAudio": [["pol-s0"], ["pol-s1"], ["pol-s2"], ["pol-s3"], ["pol-s4", "pol-s4_1"], ["pol-s5"], ["pol-s6", "pol-s6_1"], ["pol-s7"], ["pol-s8"], ["pol-s9", "pol-s9_1"]]}], "voice": [["geo-s0", "Resources are anything that has value and can be used to satisfy human needs."], ["geo-s1", "Features of resources: they have utility, they are unevenly distributed, and their development depends on human beings, knowledge, skill and technology."], ["geo-s2", "Nature becomes a resource when its materials are useful and valuable to humans, can be accessed, and are used to satisfy human needs."], ["geo-s3", "Based on use: resources for life (air, water, soil, food), for materials (wood, marble, metals, minerals) and for energy (coal, petroleum, natural gas, sunlight, wind, flowing water)."], ["geo-s4", "Based on renewability: renewable resources are replenished naturally (sunlight, wind, water, forest). Non-renewable resources take millions of years to form (coal, petroleum,"], ["geo-s4_1", "natural gas, minerals, metals)."], ["geo-s5", "Five criteria to categorize resources: use, renewability, origin (biotic, abiotic), status of development (potential, actual, stock, reserve) and distribution (ubiquitous, localized)."], ["geo-s6", "Resources are unevenly distributed because of climate, relief, altitude and geographical structure."], ["geo-s7", "Effects of uneven distribution: rich and poor regions, more industries and jobs in rich areas, dependence on other areas, trade, and conflicts like the Kaveri river issue."], ["geo-s8", "Resource curse: having resources does not make a country rich if they are not used properly, for example without industries, technology and skilled labour."], ["geo-s9", "Sustainable development is the responsible and judicious (wise) use of resources so that they remain available for future generations."], ["geo-s10", "Sustainable practices: use only what is needed, avoid overexploitation and waste, protect resources and biodiversity, recycle and reuse, use renewable energy, and use public transport."], ["geo-s11", "Traditional practices for ecological balance: seasonal fishing bans during the breeding season, and sacred groves protected by religious belief."], ["geo-s12", "Punjab groundwater depletion: water-intensive rice and wheat, plus free electricity for farmers, led to excessive use of tube wells."], ["geo-s13", "Ecosystem functions are natural processes like pollination, decomposition, water purification and climate regulation. They give clean air, fertile soil and agriculture."], ["geo-s14", "Renewable resources replenish naturally and are unlimited if used wisely, like solar energy and forest timber. Non-renewable ones are limited and exhaustible, like coal,"], ["geo-s14_1", "petroleum and minerals."], ["g1-0", "Resources are anything that has value and can be used to satisfy human needs."], ["g1-1", "They have utility."], ["g1-2", "They are unevenly distributed."], ["g1-3", "Their development depends on human beings, knowledge, skill, and technology."], ["g2-0", "When its materials or substances are useful and valuable to humans, and can be accessed and used to satisfy human needs."], ["g3-0", "Natural resources can be categorized in two ways:"], ["g3-1", "Resources essential for life: air, water, soil, food, etc."], ["g3-2", "Resources for materials: wood, marble, metals, and minerals."], ["g3-3", "Resources for energy: coal, petroleum, natural gas, sunlight, wind, flowing water, etc."], ["g3-4", "Renewable resources: resources that can be replenished (reproduced) naturally. E.g., sunlight, wind, water, forest."], ["g3-5", "Non-renewable resources: resources that take millions of years to form and cannot be replaced quickly. E.g., coal, petroleum, natural gas, minerals, and metals."], ["g4-0", "1. Based on use: For life, For material, For energy."], ["g4-1", "2. Based on renewability: Renewable, Non-renewable."], ["g4-2", "3. Based on origin: Biotic, Abiotic."], ["g4-3", "4. Based on status of development: Potential, Actual, Stock, Reserve."], ["g4-4", "5. Based on distribution: Ubiquitous, Localized."], ["g5-0", "Natural resources are unevenly distributed; it is mainly due to climate, relief, altitude, and geographical structure."], ["g5-1", "Some regions are rich in resources, while others are poor."], ["g5-2", "Resource-rich areas develop more industries and create more employment opportunities for local people."], ["g5-3", "Regions with fewer resources depend on other areas for their needs."], ["g5-4", "Trade takes place between regions and countries which are resource-rich."], ["g5-5", "Unequal distribution can lead to competition and conflicts over resources (e.g., Kaveri river issue)."], ["g5-6", "Proper management and conservation became important for sustainable development."], ["g6-0", "Having natural resources does not always make a country rich if the resources are not used properly. Development may remain slow."], ["g6-1", "E.g., a country has coal, petroleum, oil and minerals, but lacks industries, technology, and skilled labour; it cannot progress."], ["g7-0", "Sustainable development is the responsible and judicious (wise) use of resources,"], ["g7-0_1", "which means using resources wisely without wasting them so that they remain available for future generations."], ["g7-1", "Use resources only as much as needed."], ["g7-2", "Avoid overexploitation and wastage of resources."], ["g7-3", "Protect renewable and non-renewable resources."], ["g7-4", "Protect biodiversity."], ["g7-5", "Promote recycling and reuse."], ["g7-6", "Switch to renewable resources of energy for as many purposes as we can."], ["g7-7", "Depend more on public transport than private transport."], ["g8-0", "Seasonal Fishing Bans: Fishing is traditionally avoided during the breeding season. This allows the fish population to regenerate and maintain marine biodiversity."], ["g8-1", "Sacred Groves: Certain forest patches are protected owing to religious belief. This helps conserve biodiversity and protect native plant and animal species."], ["g9-0", "Cultivation of water-intensive crops such as rice and wheat increased the demand for irrigation."], ["g9-1", "Free electricity for farmers also encouraged the excessive use of tube wells for groundwater."], ["g10-0", "Ecosystem functions are natural processes such as pollination, decomposition, water purification, climate regulation, etc."], ["g10-1", "They support human life by enabling clean air, fertile soil, agriculture, and a healthy ecosystem."], ["g11-0", "These are natural resources that regenerate or replenish naturally over time through ecological cycles. Their supply can be maintained if used sustainably. E.g., solar energy,"], ["g11-0_1", "forest timber."], ["g11-1", "Definition. Renewable Resources: Replenish naturally over time. Non-Renewable Resources: Formed over millions of years; limited supply; finite and exhaustible."], ["g11-2", "Availability. Renewable Resources: Unlimited if used wisely. Non-Renewable Resources: Limited supply."], ["g11-3", "Examples. Renewable Resources: Solar energy and forest timber. Non-Renewable Resources: Coal, petroleum, minerals, etc."], ["his-s0", "Babur founded the Mughal Empire in 1526 after defeating Ibrahim Lodi in the First Battle of Panipat, ending the Delhi Sultanate."], ["his-s1", "Babur (1526 to 1530): Turkic-Mongol ruler from Samarkand, descendant of Timur. Brought gunpowder, field artillery and matchlock guns. Wrote the Baburnama. Died in 1530."], ["his-s2", "Humayun (1530 to 1556) died after a fall in 1556."], ["his-s3", "Akbar (1556 to 1605) became emperor at 13. He followed Sulh-i-kul (peace with all), abolished jizya, welcomed Rajputs, made marriage alliances and appointed Hindu officials."], ["his-s4", "Akbar used the Mansabdari system and set up a house of translation at Fatehpur Sikri, where the Mahabharata, Ramayana, Bhagavad Gita and Panchatantra were translated into Persian."], ["his-s5", "Jahangir upheld Islamic authority, tried to expand into the Deccan, and executed Guru Arjan Dev, which led to Sikh resistance."], ["his-s6", "Shahjahan (1628 to 1658) was the architectural pinnacle: he built the Taj Mahal and the Red Fort."], ["his-s7", "Aurangzeb (1658 to 1707) seized the throne from Dara Shikoh, imprisoned Shahjahan, took the title Alamgir, ruled about 49 years and made the empire its largest."], ["his-s8", "Aurangzeb was orthodox: he banned music and dance in court, reintroduced jizya and pilgrimage tax, and persecuted Shias and Sufis."], ["his-s9", "Delhi Sultanate: the Sultan held absolute power. Under the Iqta system, nobles called Iqtadars collected revenue for the army. Posts were not hereditary. Peasants paid the highest tax."], ["his-s10", "Akbar's administration: 12 provinces (Subhas). Diwan for finance, Mir Bakshi for military, Khan-i-Saman for trade, industry, agriculture and household, Sadar for justice,"], ["his-s10_1", "religion and education."], ["his-s11", "Mansabdari system: recorded in Ain-i-Akbari by Abul Fazl. Mansabdars kept troops, elephants, horses and camels, and were paid with land called Jagirs."], ["his-s12", "Todarmal, Akbar's finance minister, made revenue reforms: crop surveys, price standardisation, land measurement and mapping."], ["his-s13", "Non-Muslims were a minority in top posts, and Muslims of foreign origin were often favoured over Indian Muslims."], ["his-s14", "People's lives: rich agriculture, trade through ports like Calicut, Surat, Masulipatnam and Hooghly, Marwari credit trade and the Hundi system."], ["his-s15", "Problems: by the late 1600s peasants faced high taxes and became bonded labourers, wealth stayed with rulers and merchants, and wars displaced people. Still,"], ["his-s15_1", "India stayed prosperous and culturally vibrant."], ["h1-0", "The Mughal Empire was founded in 1526 by Babur after he defeated Ibrahim Lodi in the First Battle of Panipat, thus ending the reign of the Delhi Sultanate."], ["h2-0", "Babur was a Turkic-Mongol ruler from Samarkand, and he was a descendant of Timur and became the first ruler of the Mughal Empire."], ["h2-1", "He introduced gun powder, field artillery and matchlock guns. Those were first used in India in the First Battle of Panipat."], ["h2-2", "He authored the Baburnama (autobiography of Babur), showing his refined interests in poetry, architecture, gardens and fauna."], ["h2-3", "Known for ruthless conquest strategy including creating \"towers of skulls\" from defeated forces."], ["h2-4", "Babur died in 1530."], ["h3-0", "Humayun died after a fall in 1556."], ["h4-0", "Humayun's accidental death in 1556 AD resulted in his son Akbar becoming emperor at a very young age of 13, through the victory at Panipat."], ["h4-1", "He expanded the empire through conquests and smart alliances and established a strong and lasting Mughal rule in India."], ["h4-2", "He instituted Sulh-i-kul (Peace with all), abolished the jizya tax, and welcomed Rajputs into his court."], ["h4-3", "He entered into marriage alliances with princesses of neighbouring kingdoms and even appointed Hindu officials to high posts. Therefore,"], ["h4-3_1", "he blended administrative cohesion and religious harmony."], ["h4-4", "Used the Mansabdari system to organise bureaucracy with ranks tied to military service."], ["h4-5", "Although illiterate, he still had great interest in Persian and Indian texts."], ["h4-6", "He established a house of translation at Fatehpur Sikri where he commissioned the translation of Sanskrit texts: Mahabharata, Ramayana, Bhagavad Gita, and the Panchatantra into Persian."], ["h4-7", "Akbar was known for his liberal approach and religious tolerance."], ["h4-8", "Akbar died in 1605."], ["h5-0", "Jahangir upheld Islamic authority and tried to expand into the Deccan."], ["h5-1", "He patronised religion but also faced friction, most notably after executing Guru Arjan Dev, which led to Sikh resistance."], ["h6-0", "Shahjahan marked the architectural pinnacle of the Empire."], ["h6-1", "He built architectural marvels like the Taj Mahal and Red Fort."], ["h6-2", "Fought rebellions to consolidate his rule."], ["h7-0", "Aurangzeb seized the throne from his elder brother Dara Shikoh in 1658 and even imprisoned his father Shahjahan until his death."], ["h7-1", "He gave himself the title of \"Alamgir\" and ruled for approximately 49 years."], ["h7-2", "He conducted many campaigns and brought the Mughal Empire to its greatest territorial extent."], ["h7-3", "He was an orthodox ruler. He banned bands, dance, and music in his court, labeling them un-Islamic."], ["h7-4", "He reintroduced Jizya tax on non-Muslims and Pilgrimage tax on Hindus."], ["h7-5", "This aspect of Aurangzeb was also visible in his persecution of Muslims of other sects, including Shias and Sufis."], ["h7-6", "Aurangzeb died in 1707."], ["h8-0", "There was central authority and the Sultan held absolute power, both political and military."], ["h8-1", "Key responsibilities included defending Islamic territories, tax collection, and monitoring public welfare."], ["h8-2", "Council of ministers managed the various departments of government, alongside governors."], ["h9-0", "Land or Iqta was assigned to nobles (Iqtadars) to collect revenues for the army; the rest went to the Sultan's treasury."], ["h9-1", "Posts were not hereditary; hence, while maintaining central control, the system created local loyalty to the Sultan."], ["h9-2", "Peasants were burdened with the highest tax, with frequent cruelty reported in revenue collections."], ["h10-0", "Akbar restructured the administration for efficiency and control; divided into 12 Provinces (Subhas)."], ["h10-1", "Diwan: Managed finances and revenue."], ["h10-2", "Mir Bakshi: In charge of military affairs."], ["h10-3", "Khan-i-Saman: Supervised trade, industry, agriculture, royal household."], ["h10-4", "Sadar: Handled justice, religion and education."], ["h10-5", "Each of the 12 provinces had all such ministers."], ["h10-6", "While maintaining checks and balances among officials, Subhas were further divided under official control."], ["h10-7", "At the village level, traditional self-governance remained intact."], ["h11-0", "Introduced by Akbar, recorded in Ain-i-Akbari by Abul Fazl."], ["h11-1", "Mansabdars (ranked officers) had to maintain a specified number of troops, elephants, horses, camels."], ["h11-2", "This enabled the maintenance of a flexible and quick army without permanent costs."], ["h11-3", "Mansabdars were paid with land (Jagirs)."], ["h11-4", "Regular inspections ensured loyalty and complaints."], ["h12-0", "Todarmal was Akbar's finance minister. He introduced an efficient revenue system: crop yield surveys, price standardisation for different crops, systematic land measurement,"], ["h12-0_1", "and mapping across the Empire."], ["h12-1", "These reforms made tax collection more efficient and strengthened state control."], ["h13-0", "Despite Akbar's practical, tolerant policies, non-Muslims were a minority in top posts."], ["h13-1", "Muslims of foreign origin were often favoured over Indian Muslims."], ["h14-0", "India had a strong agricultural economy and was one of the wealthiest regions in the world."], ["h14-1", "Roads, bridges, canals, and irrigation works expanded during the Sultanate and Mughal periods."], ["h14-2", "Agriculture improved due to irrigation systems and the cultivation of multiple crops such as sugarcane, rice, wheat, barley, cotton, and spices."], ["h14-3", "Textiles, shipbuilding, handicrafts, jewellery, and metal works developed greatly."], ["h14-4", "India had extensive internal and overseas trade through ports like Calicut, Surat, Masulipatnam, or Hooghly."], ["h14-5", "Merchant communities like the Marwaris developed a system of credit trade."], ["h14-6", "The Hundi system helped merchants transfer money without carrying cash."], ["h15-0", "By the late 1600s, many peasants suffered from high taxes, lost their land, and became bonded labourers."], ["h15-1", "Wealth was mainly concentrated in the hands of the rulers, courtiers, high officials, and the merchants."], ["h15-2", "Frequent warfare caused forced displacements of people and economic hardship."], ["h15-3", "Despite some conflicts, people of different religious communities generally lived peacefully together and depended on one another."], ["h15-4", "Though politically unstable, India remained economically prosperous and culturally vibrant."], ["mar-s0", "Geography helped the Marathas: the hilly Western Ghats gave natural protection for strong forts, and the rugged land allowed guerrilla warfare (Ganimi Kava)."], ["mar-s1", "The difficult land made people resilient, skilled warriors, and narrow passes and dense forests made it hard for large enemy armies to invade."], ["mar-s2", "Shivaji Maharaj's administration had the Ashtapradhan Mandal, a council of 8 ministers led by the Peshwa (Prime Minister)."], ["mar-s3", "Revenue was based on actual crop yield and collected directly from farmers without middlemen. He had a disciplined standing army and a powerful navy."], ["mar-s4", "Each fort had three officers, Havaldar, Sabnis and Karkhanis, to prevent corruption and treason. Local Panchayats gave simple and quick justice."], ["mar-s5", "Shivaji Maharaj was born at Shivneri Fort, founded the Maratha Empire and was crowned Chhatrapati at Raigad Fort in 1674."], ["mar-s6", "He pioneered guerrilla warfare against the Mughals and Deccan Sultanates, promoted Swarajya (self-rule) and secular administration, and built a strong navy and fortified coastline."], ["mar-s7", "Sambhaji Maharaj, the eldest son, fought Aurangzeb without losing any fort, wrote Budhabhushanam, and was captured and martyred by Aurangzeb in 1689."], ["mar-s8", "Rajaram Maharaj shifted the capital to Jinji to continue the resistance. Maharani Tarabai led the Maratha War of Independence after his death."], ["mar-s9", "Peshwa Baji Rao I expanded Maratha power into Malwa, Bundelkhand and Gujarat, was undefeated in over 41 battles, and defeated the Nizam at the Battle of Palkhed."], ["m1-0", "Protection & Defence: Maharashtra's hilly terrain, naturally fortified with the Western Ghats, helped the Marathas build strong forts."], ["m1-1", "Guerrilla Warfare (Ganimi Kava): The rugged landscape enabled the Marathas to launch surprise attacks and retreat safely."], ["m1-2", "Self-Reliance & Hardiness: Difficult geography made people resilient and skilled warriors."], ["m1-3", "Strategic Advantage: Narrow passes and dense forests made it hard for larger enemy armies to invade."], ["m2-0", "Ashtapradhan Mandal (Council of 8 Ministers): Led by the Peshwa (Prime Minister) to manage various departments."], ["m2-1", "Revenue System: Assessment based on actual crop yield, collected directly from farmers without middlemen."], ["m2-2", "Military Organisation: Well-trained standing army with strict discipline and a powerful navy."], ["m2-3", "Fort Administration: Each fort had three officers (Havaldar, Sabnis, Karkhanis) to prevent corruption and treason."], ["m2-4", "Justice System: Local Panchayats handled disputes, providing simple and quick justice."], ["m3-0", "Founder of the Maratha Empire, born at Shivneri Fort."], ["m3-1", "Crowned (coronated) as Chhatrapati at Raigad Fort in 1674."], ["m3-2", "Pioneered Guerrilla Warfare (Ganimi Kava) against the Mughals and Deccan Sultanates."], ["m3-3", "Promoted Swarajya (Self-Rule) and secular administration."], ["m3-4", "Built a strong navy and fortified coastline."], ["m4-0", "Eldest son and successor of Chhatrapati Shivaji Maharaj."], ["m4-1", "Fought bravely against Aurangzeb on multiple fronts without losing any fort."], ["m4-2", "Scholar proficient in multiple languages; authored Budhabhushanam."], ["m4-3", "Captured and martyred by Aurangzeb in 1689, remaining loyal to Swarajya."], ["m5-0", "Rajaram Maharaj: Shifted the capital to Jinji to continue resistance against the Mughals after Sambhaji's martyrdom."], ["m5-1", "Maharani Tarabai: Led the Maratha War of Independence after Rajaram Maharaj's death, defending Swarajya against Aurangzeb's full imperial force."], ["m6-0", "Expanded Maratha power into Northern India (Malwa, Bundelkhand, Gujarat)."], ["m6-1", "Undefeated in over 41 battles; master of swift cavalry movements."], ["m6-2", "Defeated the Nizam of Hyderabad at the Battle of Palkhed."], ["eco-s0", "There are four factors of production: land, labour, capital and entrepreneurship."], ["eco-s1", "Land means natural resources like soil and water. Labour is human physical and mental effort."], ["eco-s2", "Capital means man-made tools, machinery and finance used in production. Entrepreneurship is the ability to organise the other three and take risks for profit."], ["eco-s3", "Entrepreneurs bring together land, labour and capital. Skilled labour (human capital) increases efficiency, and capital goods support labour."], ["eco-s4", "Human capital includes skills, knowledge and health. It raises productivity and quality, supports innovation and leads to economic growth."], ["eco-s5", "Human capital is built through education, vocational training, health care, and platforms like SWAYAM and National Career Service."], ["eco-s6", "Without skilled workers, businesses face low productivity, poor quality, delays, higher training costs, and loss of customers and profit."], ["e1-0", "The factors of production include:"], ["e1-1", "Land: Natural resource like soil and water."], ["e1-2", "Labour: Human physical and mental effort."], ["e1-3", "Capital: Man-made tools, machinery, finance used in production."], ["e1-4", "Entrepreneurship: The ability to organise the other three and take risk for profit."], ["e2-0", "Entrepreneurs bring together land, labour, and capital to produce goods."], ["e2-1", "Skilled labour (human capital) increases worker efficiency, and capital goods support labour."], ["e3-0", "Human capital includes skills, knowledge, and health, which enhances productivity."], ["e3-1", "These factors help in increasing efficiency and output quality, supporting innovation, leading to economic growth."], ["e3-2", "It is built through education and vocational training, health care, and platforms like SWAYAM and National Career Service."], ["e4-0", "When businesses cannot find skilled workers, they face:"], ["e4-1", "Low productivity."], ["e4-2", "Poor quality products or services."], ["e4-3", "Delays, increased training costs, loss of customers and profit."], ["e4-4", "Skilled workers are essential for business growth and competition."], ["pol-s0", "Universal Franchise is guaranteed under Article 326 of the Constitution. It reflects equality, participation and representation."], ["pol-s1", "The voting age was lowered from 21 to 18 in 1988. Every citizen must register as a voter in their constituency; people with certain criminal records are barred."], ["pol-s2", "Universal Franchise gives everyone an equal political voice, lets people choose representatives, promotes participation and accountability, and bridges caste, class and gender barriers."], ["pol-s3", "The Election Commission of India (ECI) was established in 1950 under Article 324. It is an independent constitutional authority."], ["pol-s4", "The ECI conducts elections to Lok Sabha, Rajya Sabha, State Assemblies, President and Vice President; updates electoral rolls; registers parties and allots symbols; enforces the MCC;"], ["pol-s4_1", "oversees counting and results."], ["pol-s5", "An electoral roll is the official list of all eligible voters in a constituency."], ["pol-s6", "The Model Code of Conduct (MCC) is a set of ECI rules for free, fair and peaceful elections: no misuse of government power, no new schemes, no government resources, no hate speech,"], ["pol-s6_1", "gifts or cash, and officials must not campaign."], ["pol-s7", "India has a parliamentary system with direct and indirect elections at national, state and local levels."], ["pol-s8", "First-Past-The-Post is used for Lok Sabha and State Assembly elections; Single Transferable Vote for Rajya Sabha and Presidential elections."], ["pol-s9", "Parliament has two houses: Rajya Sabha (Council of States, Upper House, 245 members: 233 elected by MLAs and 12 nominated by the President) and Lok Sabha (House of People, Lower House,"], ["pol-s9_1", "not more than 550 members)."], ["p1-0", "Guaranteed under Article 326 of the Indian Constitution."], ["p1-1", "Reflects equality, participation and representation in a democracy."], ["p1-2", "Voting age was lowered from 21 to 18 in 1988."], ["p1-3", "Bridges barriers such as caste, class and gender."], ["p1-4", "Every Indian citizen must register as a voter in their constituency."], ["p1-5", "Individuals with certain criminal records are barred from voting."], ["p2-0", "Ensures equal political voice."], ["p2-1", "Empowers the people to choose their representative."], ["p2-2", "Promotes civic participation and accountability."], ["p2-3", "Bridges barriers (such as caste, class and gender)."], ["p2-4", "Ensures that representatives are answerable to the people."], ["p3-0", "Established: in 1950 under Article 324 of the Constitution."], ["p3-1", "Nature: Independent constitutional authority."], ["p3-2", "Conducts elections to Lok Sabha, Rajya Sabha, State Assemblies, and the offices of President & Vice President."], ["p3-3", "Prepares and updates electoral rolls."], ["p3-4", "Registers political parties and allots election symbols."], ["p3-5", "Enforces the Model Code of Conduct (MCC)."], ["p3-6", "Oversees counting and result declaration."], ["p3-7", "Electoral Roll: Official list of all eligible voters in a constituency."], ["p4-0", "A set of rules issued by the ECI to ensure free, fair and peaceful elections."], ["p4-1", "Prevents misuse of government power during elections."], ["p4-2", "No new schemes can be announced by the ruling party."], ["p4-3", "No use of government resources for election purposes."], ["p4-4", "No hate speech, gifts or cash to influence voters."], ["p4-5", "Government officials must not campaign for any party."], ["p4-6", "Violations are punishable and monitored by the ECI."], ["p5-0", "Parliamentary system with direct and indirect elections, allowing citizens to participate at national, state and local levels."], ["p5-1", "Uses the First-Past-The-Post system for Lok Sabha and State Assembly elections."], ["p5-2", "Uses the Single Transferable Vote system for Rajya Sabha and Presidential elections."], ["p5-3", "The ECI conducts elections at national and state levels."], ["p6-0", "Divided into two houses: Council of States (Rajya Sabha) and House of People (Lok Sabha)."], ["p6-1", "Rajya Sabha is the Upper House; Lok Sabha is the Lower House."], ["p6-2", "Rajya Sabha has 245 members (233 elected by MLAs, 12 nominated by the President)."], ["p6-3", "Lok Sabha has not more than 550 members."]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TXT = Object.fromEntries(D.voice);
const CH = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = k => new Set(JSON.parse(localStorage.getItem(k) || '[]'));
const readSet = load('ss8-read'), okSet = load('ss8-ok');
const save = () => { localStorage.setItem('ss8-read', JSON.stringify([...readSet])); localStorage.setItem('ss8-ok', JSON.stringify([...okSet])); };
let slow = localStorage.getItem('ss8-slow') === '1';

const qsOf = (c, tid) => c.quiz.filter(q => q.topic === tid);
const mastered = (c, tid) => qsOf(c, tid).every(q => okSet.has(q.id));
function starsOf(c) {
  let got = 0;
  c.topics.forEach(t => { if (readSet.has(t.id)) got++; if (mastered(c, t.id)) got++; });
  return {got, total: c.topics.length * 2};
}
function allStars() {
  return D.chapters.reduce((s, c) => { const x = starsOf(c); return {got: s.got + x.got, total: s.total + x.total}; }, {got: 0, total: 0});
}

const sp = new Audio();
let ptok = 0, cur = null;
const rate = () => slow ? 0.75 : 1;
function clearOn() {
  document.querySelectorAll('.ln.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll('.mini').forEach(b => b.textContent = '▶');
}
function stopAll() { ptok++; sp.pause(); clearOn(); cur = null; }
function playClip(id, mine, text) {
  return new Promise(res => {
    if (mine !== ptok) return res(false);
    let remote = false;
    sp.onended = () => res(mine === ptok);
    sp.onerror = () => {
      if (mine !== ptok) return res(false);
      const t = text || TXT[id];
      if (!remote && t) {
        remote = true;
        sp.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en-IN&q=' + encodeURIComponent(t.slice(0, 190));
        sp.defaultPlaybackRate = sp.playbackRate = rate();
        sp.play().catch(() => {});
      } else res(false);
    };
    sp.src = id ? 'voice/' + id + '.mp3' : 'about:blank';
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
async function playLines(els, after) {
  stopAll();
  const mine = ptok;
  for (const el of els) {
    if (mine !== ptok) return;
    clearOn();
    el.classList.add('on');
    const b = el.querySelector('.mini');
    if (b) b.textContent = '⏸';
    cur = {el, paused: false};
    el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    for (const id of el.dataset.a.split(',')) {
      if (!(await playClip(id, mine))) return;
    }
  }
  if (mine === ptok) { stopAll(); if (after) after(); }
}
function sayText(t) { stopAll(); playClip(null, ptok, t.replace(/_+/g, ' blank ')); }
document.addEventListener('click', e => {
  const m = e.target.closest('.mini');
  if (!m) return;
  const el = m.closest('.ln');
  if (cur && cur.el === el) {
    if (cur.paused) { cur.paused = false; sp.play().catch(() => {}); m.textContent = '⏸'; }
    else { cur.paused = true; sp.pause(); m.textContent = '▶'; }
  } else playLines([el]);
});
function toggleSlow() {
  slow = !slow;
  localStorage.setItem('ss8-slow', slow ? '1' : '0');
  sp.defaultPlaybackRate = sp.playbackRate = rate();
  document.querySelectorAll('.slowbtn').forEach(b => b.classList.toggle('on', slow));
}
const slowBtn = () => `<button class="slowbtn ${slow ? 'on' : ''}" onclick="toggleSlow()">🐢 Slow</button>`;

let view = {name: 'home'};
function go(v) { stopAll(); view = v; render(); window.scrollTo(0, 0); }
function render() {
  const c = view.ch ? CH[view.ch] : null;
  document.body.style.setProperty('--c1', c ? c.c1 : '#4361ee');
  document.body.style.setProperty('--c2', c ? c.c2 : '#b5179e');
  ({home, ch: chapter, rev: revision, track: tracker})[view.name]();
}

function trackerBox(x, label) {
  const pct = x.total ? Math.round(x.got / x.total * 100) : 0;
  return `<div class="tracker"><div class="row"><span>⭐ ${label}</span><span>${x.got} / ${x.total} stars · ${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <small>Each topic has 2 stars: 📖 read it (listen or tap "Mark as read") and 🎯 answer all its questions correctly.</small></div>`;
}

function home() {
  app.innerHTML = `
    <div class="hero"><div class="big">📘</div><h1>Class 8 Social Science</h1><p>Geography · History · Economics · Politics · Learn, listen and play!</p></div>
    ${trackerBox(allStars(), 'My Life Stars')}
    <div class="cgrid">${D.chapters.map(c => {
      const x = starsOf(c), pct = Math.round(x.got / x.total * 100);
      return `<button class="ccard" style="--c1:${c.c1};--c2:${c.c2}" onclick="go({name:'ch',ch:'${c.id}',tab:'sum'})">
        <span class="em">${c.emoji}</span><div class="sub">${c.subject}</div><h2>${esc(c.title)}</h2>
        <div class="bar"><i style="width:${pct}%"></i></div><div class="st">⭐ ${x.got} / ${x.total} stars · ${c.topics.length} topics · ${c.quiz.length} questions</div></button>`;
    }).join('')}</div>
    <div class="quick">
      <button class="qbtn" style="--b:linear-gradient(135deg,#06d6a0,#118ab2)" onclick="go({name:'rev'})">⚡ Quick Revision<small>All summaries in one place</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#ffb703,#fb8500)" onclick="startQuiz({all:true})">🏆 Mixed Practice<small>All chapters, until all correct</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#ef476f,#b5179e)" onclick="startChallenge({all:true})">❤️ Challenge<small>All chapters · 3 lives</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#7b2cbf,#4361ee)" onclick="go({name:'track'})">⭐ Star Tracker<small>Check what is covered</small></button>
    </div>
    <p class="foot">Hindi revision app: <a href="hindi.html">open here</a></p>`;
}

function topBar(c, small, title, right) {
  return `<div class="top">
    <button class="home" title="Home" onclick="location.href='../index.html'">🏠</button>
    <button class="home" title="Back" onclick="if(history.length>1)history.back();else go({name:'home'})">←</button>
    <div class="tt"><small>${small}</small><b>${esc(title)}</b></div>${right || ''}${slowBtn()}</div>`;
}

function blockHtml(b) {
  const bold = t => { const i = t.indexOf(': '); return i > 0 && i < 45 ? `<b class="k">${esc(t.slice(0, i))}:</b> ${esc(t.slice(i + 2))}` : esc(t); };
  if (b.h) return `<h4>${esc(b.h)}</h4>`;
  if (b.p) return `<div class="ln" data-a="${b.a.join(',')}"><button class="mini">▶</button><span class="tx">${bold(b.p)}</span></div>`;
  if (b.ul) return b.ul.map((t, i) => `<div class="ln li" data-a="${b.a[i].join(',')}"><button class="mini">▶</button><span class="tx">${bold(t)}</span></div>`).join('');
  if (b.table) return `<table><tr>${b.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${b.table.rows.map((r, i) =>
    `<tr class="ln" data-a="${b.a[i].join(',')}">${r.map((x, j) => `<td>${j === 0 ? '<button class="mini">▶</button>' : ''}${j === 0 ? `<b class="k">${esc(x)}</b>` : esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;
  return '';
}

function checklist(c) {

function listenTopic(tid) {

  save(); rerender();

function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  const em = ['⭐', '🎉', '✨', '🌟', '🎈', '💜'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}

const ov = document.getElementById('ov'), ovb = () => document.getElementById('ovb');
let G = null;
function openOv(title, c) {
  stopAll();
  ov.style.setProperty('--c1', c ? c.c1 : '#4361ee');
  ov.style.setProperty('--c2', c ? c.c2 : '#b5179e');
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = '';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { stopAll(); ov.classList.remove('show'); document.body.style.overflow = ''; G = null; rerender(); }
const setScore = t => document.getElementById('ovs').innerHTML = t;

function pool(o) {
  if (o.all) return D.chapters.flatMap(c => c.quiz.map(q => ({...q, c})));
  const c = CH[o.ch];
  return c.quiz.filter(q => !o.topic || q.topic === o.topic).map(q => ({...q, c}));
}
function quizTitle(o, word) {
  if (o.all) return word + ': All chapters';
  const c = CH[o.ch];
  if (o.topic) return '🎯 ' + c.topics.find(t => t.id === o.topic).title;
  return word + ': ' + c.subject;
}
function startQuiz(o) {
  const list = pool(o);
  G = {mode: 'practice', o, queue: shuffle(list), total: list.length, learned: new Set(), first: 0, missed: new Map()};
  openOv(quizTitle(o, '🎯 Practice'), o.ch ? CH[o.ch] : null);
  showQ();
}
function startChallenge(o) {
  const list = pool(o);
  G = {mode: 'challenge', o, queue: shuffle(list), total: list.length, lives: 3, score: 0, streak: 0, bestStreak: 0, missed: new Map()};
  openOv(quizTitle(o, '❤️ Challenge'), o.ch ? CH[o.ch] : null);
  showQ();
}
const TYPE = {mcq: ['Choose the answer', '#4361ee'], tf: ['True or False', '#06a77d'], fill: ['Fill in the blank', '#7b2cbf']};
function showQ() {
  if (!G.queue.length || (G.mode === 'challenge' && G.lives <= 0)) return quizEnd();
  const q = G.queue[0];
  G.cur = q; G.opts = q.type === 'tf' ? q.opts : shuffle(q.opts); G.answered = false;
  const done = G.mode === 'practice' ? G.learned.size : G.total - G.queue.length;
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(G.lives)}${'🤍'.repeat(3 - G.lives)}</span> · ${G.score}`);
  const qhtml = esc(q.q).replace(/_{3,}/g, '<span class="blank">&nbsp;</span>');
  ovb().innerHTML = `
    <div class="qprog"><div class="bar"><i style="width:${done / G.total * 100}%"></i></div><span>${G.mode === 'practice' ? `${G.learned.size}/${G.total} learned` : `Q ${done + 1}/${G.total} · 🔥 ${G.streak}`}</span></div>
    <div class="qc">
      <span class="badge" style="--bb:${TYPE[q.type][1]}">${TYPE[q.type][0]}</span> <span class="badge" style="--bb:${q.c.c1}">${q.c.emoji} ${q.c.subject}</span>
      <div class="qq"><span>${qhtml}</span><button class="say" onclick="sayText(G.cur.q)">🔊</button></div>
      <div class="opts">${G.opts.map((o, k) => `<button class="opt" onclick="answer(this,${k})">${esc(o)}</button>`).join('')}</div>
      <div id="after"></div>
    </div>`;
  ovb().scrollTop = 0;
}
function answer(btn, k) {
  if (G.answered) return;
  G.answered = true;
  const q = G.queue.shift(), btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  const ok = G.opts[k] === q.a;
  let note;
  if (ok) {
    btn.classList.add('ok');
    okSet.add(q.id); save();
    ding(); confetti();
    if (G.mode === 'practice') { G.learned.add(q.id); if (!G.missed.has(q.id)) G.first++; }
    else { G.score++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    note = `<div class="note good">${['Well done! 🎉', 'Super! 🌟', 'Correct! 💯', 'Brilliant! ✨'][Math.floor(Math.random() * 4)]}</div>`;
  } else {
    btn.classList.add('bad');
    btns.forEach((b, j) => { if (G.opts[j] === q.a) b.classList.add('ok'); });
    G.missed.set(q.id, {q: q.q, a: q.a});
    buzz();
    if (G.mode === 'practice') {
      G.queue.splice(Math.min(G.queue.length, 3 + Math.floor(Math.random() * 3)), 0, q);
      note = `<div class="note bad">The right answer is in green. This question will come back soon 🔁</div>`;
    } else {
      G.lives--; G.streak = 0;
      note = `<div class="note bad">Oops! You lost a life 💔 The right answer is in green.</div>`;
    }
  }
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(Math.max(0, G.lives))}${'🤍'.repeat(3 - Math.max(0, G.lives))}</span> · ${G.score}`);
  document.getElementById('after').innerHTML = note + `<button class="nx" onclick="showQ()">Next ➜</button>`;
}
function quizEnd() {
  const review = [...G.missed.values()];
  let big, msg, line, stars;
  if (G.mode === 'practice') {
    const s = G.first, n = G.total;
    stars = Math.max(1, Math.round(s / n * 5));
    big = s === n ? '🏆' : s >= n * 0.7 ? '🥳' : '💪';
    msg = s === n ? 'Perfect! All correct the first time!' : 'Great! Now you know all of them!';
    line = `${s} of ${n} correct on the first try`;
  } else {
    const key = 'ss8-best-' + (G.o.all ? 'all' : G.o.ch);
    const best = Math.max(+(localStorage.getItem(key) || 0), G.score);
    localStorage.setItem(key, best);
    stars = Math.max(1, Math.round(G.score / G.total * 5));
    big = G.lives > 0 ? '🏆' : '💥';
    msg = G.lives > 0 ? 'You finished with lives left!' : 'Game over! Try to beat your score.';
    line = `Score: ${G.score} · Best streak: 🔥 ${G.bestStreak} · Best score: ${best}`;
  }
  ovb().innerHTML = `<div class="end"><div class="bigem">${big}</div><h2>${msg}</h2><p style="font-size:17px">${line}</p>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)}</div>
    ${review.length ? `<div class="review"><h3>Read these once more:</h3>${review.map(r => `<div>${esc(r.q)}<br><b>✔ ${esc(r.a)}</b></div>`).join('')}</div>` : ''}
    <div class="row2"><button class="nx" onclick="${G.mode === 'practice' ? 'startQuiz' : 'startChallenge'}(G.o)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
  confetti(); ding();
}

function startFlash(cid) {
  const c = CH[cid];
  G = {mode: 'flash', c, deck: shuffle(c.flash), i: 0};
  openOv('🃏 Flashcards: ' + c.subject, c);
  showFlash();
}
function showFlash() {
  const [f, b] = G.deck[G.i];
  setScore(`${G.i + 1} / ${G.deck.length}`);
  ovb().innerHTML = `<p class="mh">Think of the answer, then tap the card to flip it 👆</p>
    <div class="flash" id="fc" onclick="this.classList.toggle('fl')"><div class="in">
      <div class="f fr">${esc(f)}<small>tap to flip</small></div><div class="f bk">${esc(b)}</div></div></div>
    <div class="row2"><button class="nx alt" onclick="G.i=(G.i-1+G.deck.length)%G.deck.length;showFlash()">← Back</button>
      <button class="nx alt" onclick="sayText(G.deck[G.i][0]+'. '+G.deck[G.i][1])">🔊</button>
      <button class="nx" onclick="G.i=(G.i+1)%G.deck.length;showFlash()">Next →</button></div>
    <div class="row2"><button class="nx alt" onclick="G.deck=shuffle(G.deck);G.i=0;showFlash()">🔀 Shuffle</button></div>`;
}

function startMatch(cid, mi) {
  const c = CH[cid], m = c.match[mi];
  const pairs = shuffle(m.pairs.map((p, i) => ({l: p[0], r: p[1], i})));
  const nr = Math.ceil(pairs.length / 5), size = Math.ceil(pairs.length / nr), rounds = [];
  for (let k = 0; k < pairs.length; k += size) rounds.push(pairs.slice(k, k + size));
  G = {mode: 'match', c, cid, mi, m, rounds, r: 0, mistakes: 0};
  openOv('🔗 ' + m.title, c);
  showMatch();
}
function showMatch() {
  const R = G.rounds[G.r];
  G.done = 0; G.sel = null;
  setScore(`Round ${G.r + 1}/${G.rounds.length}`);
  ovb().innerHTML = `<p class="mh">Tap one on the left, then its partner on the right 👆</p><div class="mcols">
    <div class="mcol"><h4>${esc(G.m.left)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickL(this)">${esc(p.l)}</button>`).join('')}</div>
    <div class="mcol"><h4>${esc(G.m.right)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickR(this)">${esc(p.r)}</button>`).join('')}</div></div>`;
}
function pickL(b) {
  if (b.classList.contains('done')) return;
  document.querySelectorAll('.mcol:first-child .mb').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); G.sel = b;
}
function pickR(b) {
  if (b.classList.contains('done')) return;
  if (!G.sel) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); return; }
  if (b.dataset.i === G.sel.dataset.i) {
    [b, G.sel].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
    G.sel = null; G.done++; ding();
    if (G.done === G.rounds[G.r].length) setTimeout(matchEnd, 500);
  } else {
    const s = G.sel; [b, s].forEach(x => x.classList.add('bad'));
    setTimeout(() => { b.classList.remove('bad'); s.classList.remove('bad'); }, 400);
    G.mistakes++; buzz();
  }
}
function matchEnd() {
  const last = G.r + 1 >= G.rounds.length;
  confetti();
  ovb().innerHTML = `<div class="end"><div class="bigem">${last ? '🏆' : '🎉'}</div><h2>${last ? 'All pairs matched!' : 'Round complete!'}</h2>
    ${last ? `<p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>` : ''}
    <div class="row2">${last ? `<button class="nx" onclick="startMatch(G.cid,G.mi)">🔁 Play again</button>` : `<button class="nx" onclick="G.r++;showMatch()">Next round ➜</button>`}
    <button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
}

function startSort(cid, si) {
  const c = CH[cid], s = c.sort[si];
  G = {mode: 'sort', c, cid, si, s, left: shuffle(s.items.map((it, i) => i)), placed: s.buckets.map(() => []), sel: null, mistakes: 0};
  openOv('🧺 ' + s.title, c);
  showSort();
}
function showSort() {
  const s = G.s;
  setScore(`${s.items.length - G.left.length}/${s.items.length}`);
  if (!G.left.length) {
    confetti(); ding();
    ovb().innerHTML = `<div class="end"><div class="bigem">🏆</div><h2>Everything sorted!</h2><p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>
      <div class="row2"><button class="nx" onclick="startSort(G.cid,G.si)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
    return;
  }
  ovb().innerHTML = `<p class="mh">Tap an item, then tap the group it belongs to 👇</p>
    <div class="pool">${G.left.map(i => `<button class="chipb ${G.sel === i ? 'sel' : ''}" data-i="${i}" onclick="G.sel=${i};showSort()">${esc(s.items[i][0])}</button>`).join('')}</div>
    <div class="buckets">${s.buckets.map((b, k) => `<div class="bucket" onclick="dropTo(${k},this)"><h4>${esc(b)}</h4>${G.placed[k].map(i => `<div>${esc(s.items[i][0])}</div>`).join('')}</div>`).join('')}</div>`;
}
function dropTo(k, el) {
  if (G.sel === null) return;
  const i = G.sel;
  if (G.s.items[i][1] === k) {
    G.placed[k].push(i); G.left = G.left.filter(x => x !== i); G.sel = null; ding(); showSort();
  } else {
    G.mistakes++; buzz();
    const chip = document.querySelector(`.chipb[data-i="${i}"]`);
    if (chip) { chip.classList.add('bad'); setTimeout(() => chip.classList.remove('bad'), 400); }
  }
}

function startOrder(cid, oi) {
  const c = CH[cid], o = c.order[oi];
  G = {mode: 'order', c, cid, oi, o, picked: 0, shuf: shuffle(o.items.map((_, i) => i)), mistakes: 0};
  openOv('🔢 ' + o.title, c);
  setScore('');
  ovb().innerHTML = `<div class="qc"><div class="qq"><span>Tap them in the correct order: first one first!</span></div>
    <div class="oans" id="oans"></div>
    <div class="oleft">${G.shuf.map(i => `<button class="opt" data-i="${i}" onclick="pickO(this)">${esc(o.items[i])}</button>`).join('')}</div><div id="after"></div></div>`;
}
function pickO(b) {
  if (+b.dataset.i === G.picked) {
    G.picked++;
    document.getElementById('oans').insertAdjacentHTML('beforeend', `<div>${G.picked}. ${esc(G.o.items[+b.dataset.i])}</div>`);
    b.remove(); ding();
    if (G.picked === G.o.items.length) {
      confetti();
      document.getElementById('after').innerHTML = `<div class="note good">Perfect order! 🎉 Mistakes: ${G.mistakes}</div>
        <div class="row2"><button class="nx" onclick="startOrder(G.cid,G.oi)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div>`;
    }
  } else {
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); G.mistakes++; buzz();
  }
}

render();
</script>
</body>
</html>
