<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 8 Social Science – Learn & Play</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI","Roboto",system-ui,sans-serif;color:#1f2340;background:linear-gradient(180deg,#e0f2ff 0%,#f6efff 50%,#fff6e8 100%);min-height:100vh;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:12px 14px 70px}

.hero{text-align:center;padding:18px 8px 6px}
.hero .big{font-size:58px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.hero h1{margin:4px 0 0;font-size:32px;background:linear-gradient(90deg,#4361ee,#b5179e,#f77f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:2px 0 0;color:#5b5f86;font-size:17px}
.tracker{background:#fff;border-radius:22px;padding:14px 16px;margin:14px 0;box-shadow:0 6px 0 #e3e0f7}
.tracker .row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
.bar{height:16px;background:#ece9fb;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd60a,#06d6a0);transition:width .5s}
.tracker small{display:block;color:#6b6f93;margin-top:6px;font-size:14px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border:0;border-radius:24px;padding:16px;text-align:left;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.15);transition:transform .12s}
.ccard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ccard .sub{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.9}
.ccard .em{font-size:48px;float:right;line-height:1}
.ccard h2{margin:4px 0 10px;font-size:22px;line-height:1.25}
.ccard .bar{background:rgba(255,255,255,.3)}
.ccard .st{font-weight:700;font-size:14px;margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.qbtn{border:0;border-radius:20px;padding:14px;text-align:left;font-weight:800;font-size:17px;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.qbtn small{display:block;font-weight:600;font-size:13px;opacity:.95}
.foot{text-align:center;margin-top:26px;font-size:14px;color:#6b6f93}
.foot a{color:#4361ee}

.top{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.12)}
.top .home{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.top .tt{flex:1;min-width:0}
.top .tt small{display:block;font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.4px}
.top .tt b{display:block;font-size:19px;line-height:1.2}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.slowbtn{border:0;border-radius:99px;padding:7px 10px;font-weight:800;font-size:14px;background:rgba(255,255,255,.25);color:#fff;white-space:nowrap}
.slowbtn.on{background:#ffd60a;color:#3a2b00}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tab{border:0;border-radius:16px;padding:11px 4px;font-weight:800;font-size:15px;background:#fff;box-shadow:0 5px 0 #dedbf3}
.tab.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c2)}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.pill{border:0;border-radius:99px;padding:10px 18px;font-weight:800;font-size:15px;color:#fff;background:var(--c1);box-shadow:0 4px 0 var(--c2)}
.pill.alt{background:#fff;color:#1f2340;box-shadow:0 4px 0 #dedbf3}

.scard{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 0 #e6e3f7;border-left:6px solid var(--c1)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c1);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:3px}
.ln.on{background:#fff6cc}
.scard.ln.on{background:#fff6cc}
.mini{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #e3e0f7;background:#fff;font-size:14px;margin-top:1px}
.ln.on .mini{background:#ffb703;border-color:#f48c06;color:#fff}
.scard span.tx{flex:1;font-size:17px}

.topic{background:#fff;border-radius:22px;padding:14px;margin-bottom:16px;box-shadow:0 6px 0 #e6e3f7;border-top:6px solid var(--c1)}
.topic.done{border-top-color:#06d6a0}
.th{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.th h3{margin:0;font-size:19px;line-height:1.3;color:var(--c2)}
.tstars{display:flex;gap:6px;flex:none}
.tstars span{background:#f4f2ff;border-radius:99px;padding:3px 8px;font-size:14px;font-weight:700;white-space:nowrap}
.topic h4{margin:12px 0 4px;font-size:16px;color:#4a4f7a}
.topic .ln{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:12px}
.topic .ln span.tx{flex:1;font-size:16.5px}
.topic .ln.li span.tx::before{content:"•";color:var(--c1);font-weight:900;margin-right:6px}
.topic table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.topic th{background:var(--c1);color:#fff;text-align:left;padding:8px}
.topic td{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
.topic tr.ln td:first-child{white-space:nowrap}
.topic tr.ln td:first-child .mini{margin-right:6px;vertical-align:middle}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtns button{border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:14px;background:#f1efff;box-shadow:0 3px 0 #dedbf3}
.tbtns button.read{background:#06d6a0;color:#fff;box-shadow:0 3px 0 #04a57b}
b.k{color:var(--c2)}

.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gt{border:0;border-radius:20px;padding:14px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.gt .i{font-size:30px;display:block}
.gt b{display:block;font-size:17px;line-height:1.25}
.gt small{display:block;font-size:13px;opacity:.95;margin-top:2px}
.ghead{font-weight:800;color:#4a4f7a;margin:16px 2px 8px;font-size:16px}

.check{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 #e6e3f7}
.check .ct{flex:1;font-weight:700;font-size:15px}
.check .ct small{display:block;color:#6b6f93;font-weight:600}
.check .s{font-size:20px}
.check button{border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;background:#f1efff}

.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:linear-gradient(160deg,#eef0ff,#fff0f7 55%,#fff8e6)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1,#4361ee),var(--c2,#b5179e))}
.ovtop button{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;font-weight:900;color:#333;flex:none}
.ovtop .t{flex:1;font-weight:800;font-size:17px}
.ovtop .sc{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-weight:800;white-space:nowrap}
.ovb{flex:1;overflow-y:auto;padding:16px 14px 40px;max-width:820px;width:100%;margin:0 auto}
.qprog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:800;color:#4a4f7a;font-size:14px}
.qprog .bar{flex:1;margin:0}
.qc{background:#fff;border-radius:22px;padding:16px;box-shadow:0 7px 0 #e6e3f7}
.badge{display:inline-block;border-radius:99px;padding:3px 12px;color:#fff;font-size:13px;font-weight:800;background:var(--bb,#4361ee)}
.qq{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:20px;font-weight:800;line-height:1.45}
.qq span{flex:1}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid #7b2cbf;margin:0 4px}
.say{border:0;background:#efeaff;border-radius:50%;width:42px;height:42px;font-size:17px;flex:none}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:16px;padding:12px 14px;font-size:17px;text-align:left;line-height:1.4;box-shadow:0 4px 0 #e3e0f7}
.opt.ok{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;animation:pop .35s}
.opt.bad{background:#ffd3d3;border-color:#e5484d;box-shadow:0 4px 0 #e5484d;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.note{margin-top:12px;font-weight:800;text-align:center}
.note.good{color:#1f9d55}.note.bad{color:#d9480f}
.nx{display:block;margin:14px auto 0;border:0;border-radius:99px;padding:12px 34px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4361ee,#b5179e);box-shadow:0 5px 0 rgba(67,97,238,.35)}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row2 .nx{margin:0}
.nx.alt{background:#fff;color:#4361ee;border:2px solid #cfd6ff;box-shadow:0 5px 0 #e3e0f7}
.end{text-align:center;background:#fff;border-radius:24px;padding:22px 16px;box-shadow:0 7px 0 #e6e3f7}
.end .bigem{font-size:64px}
.end h2{margin:4px 0;font-size:24px;color:#4361ee}
.end .stars{font-size:30px;letter-spacing:2px}
.review{text-align:left;margin-top:14px}
.review h3{margin:0 0 8px;color:#d9480f;font-size:17px}
.review div{background:#fff7e0;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:15px}
.review div b{color:#1f9d55}
.lives{font-size:20px;letter-spacing:2px}

.flash{perspective:1000px;height:300px;margin:6px 0 14px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .f{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.flash .fr{background:#fff;border:4px solid var(--c1,#4361ee);font-size:26px;font-weight:800;color:var(--c2,#333)}
.flash .bk{background:linear-gradient(140deg,var(--c1,#4361ee),var(--c2,#b5179e));color:#fff;transform:rotateY(180deg);font-size:20px;font-weight:700;line-height:1.5}
.flash small{display:block;font-size:14px;font-weight:600;opacity:.75;margin-top:10px}

.mh{text-align:center;font-weight:800;color:#4a4f7a;margin-bottom:12px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mcol h4{margin:0;text-align:center;color:#4a4f7a}
.mb{border:2px solid #e3e0f7;background:#fff;border-radius:14px;padding:11px 9px;font-size:15px;line-height:1.35;box-shadow:0 4px 0 #e3e0f7}
.mb.sel{background:#fff1b8;border-color:#ffb703;box-shadow:0 4px 0 #ffb703}
.mb.done{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;opacity:.75}
.mb.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}

.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;min-height:46px}
.chipb{border:2px solid #e3e0f7;background:#fff;border-radius:99px;padding:9px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 0 #e3e0f7}
.chipb.sel{background:#fff1b8;border-color:#ffb703;box-shadow:0 4px 0 #ffb703;transform:scale(1.05)}
.chipb.bad{background:#ffd3d3;animation:shake .35s}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{border:3px dashed #cfc8f5;border-radius:18px;background:#fff;padding:10px;min-height:120px;text-align:center;cursor:pointer}
.bucket h4{margin:0 0 8px;font-size:16px}
.bucket div{background:#c9f7d6;border-radius:10px;padding:5px 8px;margin:5px 0;font-size:14px;font-weight:700}
.bucket.flashok{border-color:#2fbf71}

.oans{min-height:56px;background:#fff;border:3px dashed #cfc8f5;border-radius:16px;padding:8px;margin:12px 0}
.oans div{background:#c9f7d6;border-radius:10px;padding:8px 10px;margin:5px 0;font-size:15px;font-weight:700}
.oleft{display:grid;gap:9px}

.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:60;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:.6}}
@media (max-width:560px){.tab{font-size:13px}.top .tt b{font-size:16px}.mb{font-size:14px}}

.la-say{border:0;background:#efeaff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none;vertical-align:middle;margin-left:6px;box-shadow:0 3px 0 #e3e0f7}
.la-say:active{background:#ffb703}
.la-row{display:flex;gap:8px;align-items:flex-start}

</style>

c), status of development (potential, actual, stock, reserve) and distribution (ubiquitous, localized)."], ["geo-s6", "Resources are unevenly distributed because of climate, relief, altitude and geographical structure."], ["geo-s7", "Effects of uneven distribution: rich and poor regions, more industries and jobs in rich areas, dependence on other areas, trade, and conflicts like the Kaveri river issue."], ["geo-s8", "Resource curse: having resources does not make a country rich if they are not used properly, for example without industries, technology and skilled labour."], ["geo-s9", "Sustainable development is the responsible and judicious (wise) use of resources so that they remain available for future generations."], ["geo-s10", "Sustainable practices: use only what is needed, avoid overexploitation and waste, protect resources and biodiversity, recycle and reuse, use renewable energy, and use public transport."], ["geo-s11", "Traditional practices for ecological balance: seasonal fishing bans during the breeding season, and sacred groves protected by religious belief."], ["geo-s12", "Punjab groundwater depletion: water-intensive rice and wheat, plus free electricity for farmers, led to excessive use of tube wells."], ["geo-s13", "Ecosystem functions are natural processes like pollination, decomposition, water purification and climate regulation. They give clean air, fertile soil and agriculture."], ["geo-s14", "Renewable resources replenish naturally and are unlimited if used wisely, like solar energy and forest timber. Non-renewable ones are limited and exhaustible, like coal,"], ["geo-s14_1", "petroleum and minerals."], ["g1-0", "Resources are anything that has value and can be used to satisfy human needs."], ["g1-1", "They have utility."], ["g1-2", "They are unevenly distributed."], ["g1-3", "Their development depends on human beings, knowledge, skill, and technology."], ["g2-0", "When its materials or substances are useful and valuable to humans, and can be accessed and used to satisfy human needs."], ["g3-0", "Natural resources can be categorized in two ways:"], ["g3-1", "Resources essential for life: air, water, soil, food, etc."], ["g3-2", "Resources for materials: wood, marble, metals, and minerals."], ["g3-3", "Resources for energy: coal, petroleum, natural gas, sunlight, wind, flowing water, etc."], ["g3-4", "Renewable resources: resources that can be replenished (reproduced) naturally. E.g., sunlight, wind, water, forest."], ["g3-5", "Non-renewable resources: resources that take millions of years to form and cannot be replaced quickly. E.g., coal, petroleum, natural gas, minerals, and metals."], ["g4-0", "1. Based on use: For life, For material, For energy."], ["g4-1", "2. Based on renewability: Renewable, Non-renewable."], ["g4-2", "3. Based on origin: Biotic, Abiotic."], ["g4-3", "4. Based on status of development: Potential, Actual, Stock, Reserve."], ["g4-4", "5. Based on distribution: Ubiquitous, Localized."], ["g5-0", "Natural resources are unevenly distributed; it is mainly due to climate, relief, altitude, and geographical structure."], ["g5-1", "Some regions are rich in resources, while others are poor."], ["g5-2", "Resource-rich areas develop more industries and create more employment opportunities for local people."], ["g5-3", "Regions with fewer resources depend on other areas for their needs."], ["g5-4", "Trade takes place between regions and countries which are resource-rich."], ["g5-5", "Unequal distribution can lead to competition and conflicts over resources (e.g., Kaveri river issue)."], ["g5-6", "Proper management and conservation became important for sustainable development."], ["g6-0", "Having natural resources does not always make a country rich if the resources are not used properly. Development may remain slow."], ["g6-1", "E.g., a country has coal, petroleum, oil and minerals, but lacks industries, technology, and skilled labour; it cannot progress."], ["g7-0", "Sustainable development is the responsible and judicious (wise) use of resources,"], ["g7-0_1", "which means using resources wisely without wasting them so that they remain available for future generations."], ["g7-1", "Use resources only as much as needed."], ["g7-2", "Avoid overexploitation and wastage of resources."], ["g7-3", "Protect renewable and non-renewable resources."], ["g7-4", "Protect biodiversity."], ["g7-5", "Promote recycling and reuse."], ["g7-6", "Switch to renewable resources of energy for as many purposes as we can."], ["g7-7", "Depend more on public transport than private transport."], ["g8-0", "Seasonal Fishing Bans: Fishing is traditionally avoided during the breeding season. This allows the fish population to regenerate and maintain marine biodiversity."], ["g8-1", "Sacred Groves: Certain forest patches are protected owing to religious belief. This helps conserve biodiversity and protect native plant and animal species."], ["g9-0", "Cultivation of water-intensive crops such as rice and wheat increased the demand for irrigation."], ["g9-1", "Free electricity for farmers also encouraged the excessive use of tube wells for groundwater."], ["g10-0", "Ecosystem functions are natural processes such as pollination, decomposition, water purification, climate regulation, etc."], ["g10-1", "They support human life by enabling clean air, fertile soil, agriculture, and a healthy ecosystem."], ["g11-0", "These are natural resources that regenerate or replenish naturally over time through ecological cycles. Their supply can be maintained if used sustainably. E.g., solar energy,"], ["g11-0_1", "forest timber."], ["g11-1", "Definition. Renewable Resources: Replenish naturally over time. Non-Renewable Resources: Formed over millions of years; limited supply; finite and exhaustible."], ["g11-2", "Availability. Renewable Resources: Unlimited if used wisely. Non-Renewable Resources: Limited supply."], ["g11-3", "Examples. Renewable Resources: Solar energy and forest timber. Non-Renewable Resources: Coal, petroleum, minerals, etc."], ["his-s0", "Babur founded the Mughal Empire in 1526 after defeating Ibrahim Lodi in the First Battle of Panipat, ending the Delhi Sultanate."], ["his-s1", "Babur (1526 to 1530): Turkic-Mongol ruler from Samarkand, descendant of Timur. Brought gunpowder, field artillery and matchlock guns. Wrote the Baburnama. Died in 1530."], ["his-s2", "Humayun (1530 to 1556) died after a fall in 1556."], ["his-s3", "Akbar (1556 to 1605) became emperor at 13. He followed Sulh-i-kul (peace with all), abolished jizya, welcomed Rajputs, made marriage alliances and appointed Hindu officials."], ["his-s4", "Akbar used the Mansabdari system and set up a house of translation at Fatehpur Sikri, where the Mahabharata, Ramayana, Bhagavad Gita and Panchatantra were translated into Persian."], ["his-s5", "Jahangir upheld Islamic authority, tried to expand into the Deccan, and executed Guru Arjan Dev, which led to Sikh resistance."], ["his-s6", "Shahjahan (1628 to 1658) was the architectural pinnacle: he built the Taj Mahal and the Red Fort."], ["his-s7", "Aurangzeb (1658 to 1707) seized the throne from Dara Shikoh, imprisoned Shahjahan, took the title Alamgir, ruled about 49 years and made the empire its largest."], ["his-s8", "Aurangzeb was orthodox: he banned music and dance in court, reintroduced jizya and pilgrimage tax, and persecuted Shias and Sufis."], ["his-s9", "Delhi Sultanate: the Sultan held absolute power. Under the Iqta system, nobles called Iqtadars collected revenue for the army. Posts were not hereditary. Peasants paid the highest tax."], ["his-s10", "Akbar's administration: 12 provinces (Subhas). Diwan for finance, Mir Bakshi for military, Khan-i-Saman for trade, industry, agriculture and household, Sadar for justice,"], ["his-s10_1", "religion and education."], ["his-s11", "Mansabdari system: recorded in Ain-i-Akbari by Abul Fazl. Mansabdars kept troops, elephants, horses and camels, and were paid with land called Jagirs."], ["his-s12", "Todarmal, Akbar's finance minister, made revenue reforms: crop surveys, price standardisation, land measurement and mapping."], ["his-s13", "Non-Muslims were a minority in top posts, and Muslims of foreign origin were often favoured over Indian Muslims."], ["his-s14", "People's lives: rich agriculture, trade through ports like Calicut, Surat, Masulipatnam and Hooghly, Marwari credit trade and the Hundi system."], ["his-s15", "Problems: by the late 1600s peasants faced high taxes and became bonded labourers, wealth stayed with rulers and merchants, and wars displaced people. Still,"], ["his-s15_1", "India stayed prosperous and culturally vibrant."], ["h1-0", "The Mughal Empire was founded in 1526 by Babur after he defeated Ibrahim Lodi in the First Battle of Panipat, thus ending the reign of the Delhi Sultanate."], ["h2-0", "Babur was a Turkic-Mongol ruler from Samarkand, and he was a descendant of Timur and became the first ruler of the Mughal Empire."], ["h2-1", "He introduced gun powder, field artillery and matchlock guns. Those were first used in India in the First Battle of Panipat."], ["h2-2", "He authored the Baburnama (autobiography of Babur), showing his refined interests in poetry, architecture, gardens and fauna."], ["h2-3", "Known for ruthless conquest strategy including creating \"towers of skulls\" from defeated forces."], ["h2-4", "Babur died in 1530."], ["h3-0", "Humayun died after a fall in 1556."], ["h4-0", "Humayun's accidental death in 1556 AD resulted in his son Akbar becoming emperor at a very young age of 13, through the victory at Panipat."], ["h4-1", "He expanded the empire through conquests and smart alliances and established a strong and lasting Mughal rule in India."], ["h4-2", "He instituted Sulh-i-kul (Peace with all), abolished the jizya tax, and welcomed Rajputs into his court."], ["h4-3", "He entered into marriage alliances with princesses of neighbouring kingdoms and even appointed Hindu officials to high posts. Therefore,"], ["h4-3_1", "he blended administrative cohesion and religious harmony."], ["h4-4", "Used the Mansabdari system to organise bureaucracy with ranks tied to military service."], ["h4-5", "Although illiterate, he still had great interest in Persian and Indian texts."], ["h4-6", "He established a house of translation at Fatehpur Sikri where he commissioned the translation of Sanskrit texts: Mahabharata, Ramayana, Bhagavad Gita, and the Panchatantra into Persian."], ["h4-7", "Akbar was known for his liberal approach and religious tolerance."], ["h4-8", "Akbar died in 1605."], ["h5-0", "Jahangir upheld Islamic authority and tried to expand into the Deccan."], ["h5-1", "He patronised religion but also faced friction, most notably after executing Guru Arjan Dev, which led to Sikh resistance."], ["h6-0", "Shahjahan marked the architectural pinnacle of the Empire."], ["h6-1", "He built architectural marvels like the Taj Mahal and Red Fort."], ["h6-2", "Fought rebellions to consolidate his rule."], ["h7-0", "Aurangzeb seized the throne from his elder brother Dara Shikoh in 1658 and even imprisoned his father Shahjahan until his death."], ["h7-1", "He gave himself the title of \"Alamgir\" and ruled for approximately 49 years."], ["h7-2", "He conducted many campaigns and brought the Mughal Empire to its greatest territorial extent."], ["h7-3", "He was an orthodox ruler. He banned bands, dance, and music in his court, labeling them un-Islamic."], ["h7-4", "He reintroduced Jizya tax on non-Muslims and Pilgrimage tax on Hindus."], ["h7-5", "This aspect of Aurangzeb was also visible in his persecution of Muslims of other sects, including Shias and Sufis."], ["h7-6", "Aurangzeb died in 1707."], ["h8-0", "There was central authority and the Sultan held absolute power, both political and military."], ["h8-1", "Key responsibilities included defending Islamic territories, tax collection, and monitoring public welfare."], ["h8-2", "Council of ministers managed the various departments of government, alongside governors."], ["h9-0", "Land or Iqta was assigned to nobles (Iqtadars) to collect revenues for the army; the rest went to the Sultan's treasury."], ["h9-1", "Posts were not hereditary; hence, while maintaining central control, the system created local loyalty to the Sultan."], ["h9-2", "Peasants were burdened with the highest tax, with frequent cruelty reported in revenue collections."], ["h10-0", "Akbar restructured the administration for efficiency and control; divided into 12 Provinces (Subhas)."], ["h10-1", "Diwan: Managed finances and revenue."], ["h10-2", "Mir Bakshi: In charge of military affairs."], ["h10-3", "Khan-i-Saman: Supervised trade, industry, agriculture, royal household."], ["h10-4", "Sadar: Handled justice, religion and education."], ["h10-5", "Each of the 12 provinces had all such ministers."], ["h10-6", "While maintaining checks and balances among officials, Subhas were further divided under official control."], ["h10-7", "At the village level, traditional self-governance remained intact."], ["h11-0", "Introduced by Akbar, recorded in Ain-i-Akbari by Abul Fazl."], ["h11-1", "Mansabdars (ranked officers) had to maintain a specified number of troops, elephants, horses, camels."], ["h11-2", "This enabled the maintenance of a flexible and quick army without permanent costs."], ["h11-3", "Mansabdars were paid with land (Jagirs)."], ["h11-4", "Regular inspections ensured loyalty and complaints."], ["h12-0", "Todarmal was Akbar's finance minister. He introduced an efficient revenue system: crop yield surveys, price standardisation for different crops, systematic land measurement,"], ["h12-0_1", "and mapping across the Empire."], ["h12-1", "These reforms made tax collection more efficient and strengthened state control."], ["h13-0", "Despite Akbar's practical, tolerant policies, non-Muslims were a minority in top posts."], ["h13-1", "Muslims of foreign origin were often favoured over Indian Muslims."], ["h14-0", "India had a strong agricultural economy and was one of the wealthiest regions in the world."], ["h14-1", "Roads, bridges, canals, and irrigation works expanded during the Sultanate and Mughal periods."], ["h14-2", "Agriculture improved due to irrigation systems and the cultivation of multiple crops such as sugarcane, rice, wheat, barley, cotton, and spices."], ["h14-3", "Textiles, shipbuilding, handicrafts, jewellery, and metal works developed greatly."], ["h14-4", "India had extensive internal and overseas trade through ports like Calicut, Surat, Masulipatnam, or Hooghly."], ["h14-5", "Merchant communities like the Marwaris developed a system of credit trade."], ["h14-6", "The Hundi system helped merchants transfer money without carrying cash."], ["h15-0", "By the late 1600s, many peasants suffered from high taxes, lost their land, and became bonded labourers."], ["h15-1", "Wealth was mainly concentrated in the hands of the rulers, courtiers, high officials, and the merchants."], ["h15-2", "Frequent warfare caused forced displacements of people and economic hardship."], ["h15-3", "Despite some conflicts, people of different religious communities generally lived peacefully together and depended on one another."], ["h15-4", "Though politically unstable, India remained economically prosperous and culturally vibrant."], ["mar-s0", "Geography helped the Marathas: the hilly Western Ghats gave natural protection for strong forts, and the rugged land allowed guerrilla warfare (Ganimi Kava)."], ["mar-s1", "The difficult land made people resilient, skilled warriors, and narrow passes and dense forests made it hard for large enemy armies to invade."], ["mar-s2", "Shivaji Maharaj's administration had the Ashtapradhan Mandal, a council of 8 ministers led by the Peshwa (Prime Minister)."], ["mar-s3", "Revenue was based on actual crop yield and collected directly from farmers without middlemen. He had a disciplined standing army and a powerful navy."], ["mar-s4", "Each fort had three officers, Havaldar, Sabnis and Karkhanis, to prevent corruption and treason. Local Panchayats gave simple and quick justice."], ["mar-s5", "Shivaji Maharaj was born at Shivneri Fort, founded the Maratha Empire and was crowned Chhatrapati at Raigad Fort in 1674."], ["mar-s6", "He pioneered guerrilla warfare against the Mughals and Deccan Sultanates, promoted Swarajya (self-rule) and secular administration, and built a strong navy and fortified coastline."], ["mar-s7", "Sambhaji Maharaj, the eldest son, fought Aurangzeb without losing any fort, wrote Budhabhushanam, and was captured and martyred by Aurangzeb in 1689."], ["mar-s8", "Rajaram Maharaj shifted the capital to Jinji to continue the resistance. Maharani Tarabai led the Maratha War of Independence after his death."], ["mar-s9", "Peshwa Baji Rao I expanded Maratha power into Malwa, Bundelkhand and Gujarat, was undefeated in over 41 battles, and defeated the Nizam at the Battle of Palkhed."], ["m1-0", "Protection & Defence: Maharashtra's hilly terrain, naturally fortified with the Western Ghats, helped the Marathas build strong forts."], ["m1-1", "Guerrilla Warfare (Ganimi Kava): The rugged landscape enabled the Marathas to launch surprise attacks and retreat safely."], ["m1-2", "Self-Reliance & Hardiness: Difficult geography made people resilient and skilled warriors."], ["m1-3", "Strategic Advantage: Narrow passes and dense forests made it hard for larger enemy armies to invade."], ["m2-0", "Ashtapradhan Mandal (Council of 8 Ministers): Led by the Peshwa (Prime Minister) to manage various departments."], ["m2-1", "Revenue System: Assessment based on actual crop yield, collected directly from farmers without middlemen."], ["m2-2", "Military Organisation: Well-trained standing army with strict discipline and a powerful navy."], ["m2-3", "Fort Administration: Each fort had three officers (Havaldar, Sabnis, Karkhanis) to prevent corruption and treason."], ["m2-4", "Justice System: Local Panchayats handled disputes, providing simple and quick justice."], ["m3-0", "Founder of the Maratha Empire, born at Shivneri Fort."], ["m3-1", "Crowned (coronated) as Chhatrapati at Raigad Fort in 1674."], ["m3-2", "Pioneered Guerrilla Warfare (Ganimi Kava) against the Mughals and Deccan Sultanates."], ["m3-3", "Promoted Swarajya (Self-Rule) and secular administration."], ["m3-4", "Built a strong navy and fortified coastline."], ["m4-0", "Eldest son and successor of Chhatrapati Shivaji Maharaj."], ["m4-1", "Fought bravely against Aurangzeb on multiple fronts without losing any fort."], ["m4-2", "Scholar proficient in multiple languages; authored Budhabhushanam."], ["m4-3", "Captured and martyred by Aurangzeb in 1689, remaining loyal to Swarajya."], ["m5-0", "Rajaram Maharaj: Shifted the capital to Jinji to continue resistance against the Mughals after Sambhaji's martyrdom."], ["m5-1", "Maharani Tarabai: Led the Maratha War of Independence after Rajaram Maharaj's death, defending Swarajya against Aurangzeb's full imperial force."], ["m6-0", "Expanded Maratha power into Northern India (Malwa, Bundelkhand, Gujarat)."], ["m6-1", "Undefeated in over 41 battles; master of swift cavalry movements."], ["m6-2", "Defeated the Nizam of Hyderabad at the Battle of Palkhed."], ["eco-s0", "There are four factors of production: land, labour, capital and entrepreneurship."], ["eco-s1", "Land means natural resources like soil and water. Labour is human physical and mental effort."], ["eco-s2", "Capital means man-made tools, machinery and finance used in production. Entrepreneurship is the ability to organise the other three and take risks for profit."], ["eco-s3", "Entrepreneurs bring together land, labour and capital. Skilled labour (human capital) increases efficiency, and capital goods support labour."], ["eco-s4", "Human capital includes skills, knowledge and health. It raises productivity and quality, supports innovation and leads to economic growth."], ["eco-s5", "Human capital is built through education, vocational training, health care, and platforms like SWAYAM and National Career Service."], ["eco-s6", "Without skilled workers, businesses face low productivity, poor quality, delays, higher training costs, and loss of customers and profit."], ["e1-0", "The factors of production include:"], ["e1-1", "Land: Natural resource like soil and water."], ["e1-2", "Labour: Human physical and mental effort."], ["e1-3", "Capital: Man-made tools, machinery, finance used in production."], ["e1-4", "Entrepreneurship: The ability to organise the other three and take risk for profit."], ["e2-0", "Entrepreneurs bring together land, labour, and capital to produce goods."], ["e2-1", "Skilled labour (human capital) increases worker efficiency, and capital goods support labour."], ["e3-0", "Human capital includes skills, knowledge, and health, which enhances productivity."], ["e3-1", "These factors help in increasing efficiency and output quality, supporting innovation, leading to economic growth."], ["e3-2", "It is built through education and vocational training, health care, and platforms like SWAYAM and National Career Service."], ["e4-0", "When businesses cannot find skilled workers, they face:"], ["e4-1", "Low productivity."], ["e4-2", "Poor quality products or services."], ["e4-3", "Delays, increased training costs, loss of customers and profit."], ["e4-4", "Skilled workers are essential for business growth and competition."], ["pol-s0", "Universal Franchise is guaranteed under Article 326 of the Constitution. It reflects equality, participation and representation."], ["pol-s1", "The voting age was lowered from 21 to 18 in 1988. Every citizen must register as a voter in their constituency; people with certain criminal records are barred."], ["pol-s2", "Universal Franchise gives everyone an equal political voice, lets people choose representatives, promotes participation and accountability, and bridges caste, class and gender barriers."], ["pol-s3", "The Election Commission of India (ECI) <script>
const D = JSON.parse(document.getElementById('data').textContent);
const TXT = Object.fromEntries(D.voice);
const CH = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = k => new Set(JSON.parse(localStorage.getItem(k) || '[]'));
const readSet = load('ss8-read'), okSet = load('ss8-ok');
const save = () => { localStorage.setItem('ss8-read', JSON.stringify([...readSet])); localStorage.setItem('ss8-ok', JSON.stringify([...okSet])); };
let slow = localStorage.getItem('ss8-slow') === '1';

const qsOf = (c, tid) => c.quiz.filter(q => q.topic === tid);
const mastered = (c, tid) => qsOf(c, tid).every(q => okSet.has(q.id));
function starsOf(c) {
  let got = 0;
  c.topics.forEach(t => { if (readSet.has(t.id)) got++; if (mastered(c, t.id)) got++; });
  return {got, total: c.topics.length * 2};
}
function allStars() {
  return D.chapters.reduce((s, c) => { const x = starsOf(c); return {got: s.got + x.got, total: s.total + x.total}; }, {got: 0, total: 0});
}

const sp = new Audio();
let ptok = 0, cur = null;
const rate = () => slow ? 0.75 : 1;
function clearOn() {
  document.querySelectorAll('.ln.on').forEach(e => e.classList.remove('on'));
  document.querySelectorAll('.mini').forEach(b => b.textContent = '▶');
}
function stopAll() { ptok++; sp.pause(); clearOn(); cur = null; }
function playClip(id, mine, text) {
  return new Promise(res => {
    if (mine !== ptok) return res(false);
    let remote = false;
    sp.onended = () => res(mine === ptok);
    sp.onerror = () => {
      if (mine !== ptok) return res(false);
      const t = text || TXT[id];
      if (!remote && t) {
        remote = true;
        sp.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en-IN&q=' + encodeURIComponent(t.slice(0, 190));
        sp.defaultPlaybackRate = sp.playbackRate = rate();
        sp.play().catch(() => {});
      } else res(false);
    };
    sp.src = id ? 'voice/' + id + '.mp3' : 'about:blank';
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
async function playLines(els, after) {
  stopAll();
  const mine = ptok;
  for (const el of els) {
    if (mine !== ptok) return;
    clearOn();
    el.classList.add('on');
    const b = el.querySelector('.mini');
    if (b) b.textContent = '⏸';
    cur = {el, paused: false};
    el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    for (const id of el.dataset.a.split(',')) {
      if (!(await playClip(id, mine))) return;
    }
  }
  if (mine === ptok) { stopAll(); if (after) after(); }
}
function sayText(t) { stopAll(); playClip(null, ptok, t.replace(/_+/g, ' blank ')); }
document.addEventListener('click', e => {
  const m = e.target.closest('.mini');
  if (!m) return;
  const el = m.closest('.ln');
  if (cur && cur.el === el) {
    if (cur.paused) { cur.paused = false; sp.play().catch(() => {}); m.textContent = '⏸'; }
    else { cur.paused = true; sp.pause(); m.textContent = '▶'; }
  } else playLines([el]);
});
function toggleSlow() {
  slow = !slow;
  localStorage.setItem('ss8-slow', slow ? '1' : '0');
  sp.defaultPlaybackRate = sp.playbackRate = rate();
  document.querySelectorAll('.slowbtn').forEach(b => b.classList.toggle('on', slow));
}
const slowBtn = () => `<button class="slowbtn ${slow ? 'on' : ''}" onclick="toggleSlow()">🐢 Slow</button>`;

let view = {name: 'home'};
function go(v) { stopAll(); view = v; render(); window.scrollTo(0, 0); }
function render() {
  const c = view.ch ? CH[view.ch] : null;
  document.body.style.setProperty('--c1', c ? c.c1 : '#4361ee');
  document.body.style.setProperty('--c2', c ? c.c2 : '#b5179e');
  ({home, ch: chapter, rev: revision, track: tracker})[view.name]();
}

function trackerBox(x, label) {
  const pct = x.total ? Math.round(x.got / x.total * 100) : 0;
  return `<div class="tracker"><div class="row"><span>⭐ ${label}</span><span>${x.got} / ${x.total} stars · ${pct}%</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <small>Each topic has 2 stars: 📖 read it (listen or tap "Mark as read") and 🎯 answer all its questions correctly.</small></div>`;
}

function home() {
  app.innerHTML = `
    <div class="hero"><div class="big">🗺️</div><h1>Class 8 Social · Term 2</h1><p>World Geography · Learn, listen and play!</p></div>
    ${trackerBox(allStars(), 'My Life Stars')}
    <div class="cgrid">${D.chapters.map(c => {
      const x = starsOf(c), pct = Math.round(x.got / x.total * 100);
      return `<button class="ccard" style="--c1:${c.c1};--c2:${c.c2}" onclick="go({name:'ch',ch:'${c.id}',tab:'sum'})">
        <span class="em">${c.emoji}</span><div class="sub">${c.subject}</div><h2>${esc(c.title)}</h2>
        <div class="bar"><i style="width:${pct}%"></i></div><div class="st">⭐ ${x.got} / ${x.total} stars · ${c.topics.length} topics · ${c.quiz.length} questions</div></button>`;
    }).join('')}</div>
    <div class="quick">
      <button class="qbtn" style="--b:linear-gradient(135deg,#6c757d,#495057)" onclick="location.href='old-term1/'">📦 Term 1 chapters<small>Earlier syllabus · keep for practice</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#06d6a0,#118ab2)" onclick="go({name:'rev'})">⚡ Quick Revision<small>All summaries in one place</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#ffb703,#fb8500)" onclick="startQuiz({all:true})">🏆 Mixed Practice<small>All chapters, until all correct</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#ef476f,#b5179e)" onclick="startChallenge({all:true})">❤️ Challenge<small>All chapters · 3 lives</small></button>
      <button class="qbtn" style="--b:linear-gradient(135deg,#7b2cbf,#4361ee)" onclick="go({name:'track'})">⭐ Star Tracker<small>Check what is covered</small></button>
    </div>
    <p class="foot">Hindi revision app: <a href="hindi.html">open here</a></p>`;
}

function topBar(c, small, title, right) {
  return `<div class="top">
    <button class="home" title="Home" onclick="location.href='../index.html'">🏠</button>
    <button class="home" title="Back" onclick="if(history.length>1)history.back();else go({name:'home'})">←</button>
    <div class="tt"><small>${small}</small><b>${esc(title)}</b></div>${right || ''}${slowBtn()}</div>`;
}

function blockHtml(b) {
  const bold = t => { const i = t.indexOf(': '); return i > 0 && i < 45 ? `<b class="k">${esc(t.slice(0, i))}:</b> ${esc(t.slice(i + 2))}` : esc(t); };
  if (b.h) return `<h4>${esc(b.h)}</h4>`;
  if (b.p) return `<div class="ln" data-a="${b.a.join(',')}"><button class="mini">▶</button><span class="tx">${bold(b.p)}</span></div>`;
  if (b.ul) return b.ul.map((t, i) => `<div class="ln li" data-a="${b.a[i].join(',')}"><button class="mini">▶</button><span class="tx">${bold(t)}</span></div>`).join('');
  if (b.table) return `<table><tr>${b.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${b.table.rows.map((r, i) =>
    `<tr class="ln" data-a="${b.a[i].join(',')}">${r.map((x, j) => `<td>${j === 0 ? '<button class="mini">▶</button>' : ''}${j === 0 ? `<b class="k">${esc(x)}</b>` : esc(x)}</td>`).join('')}</tr>`).join('')}</table>`;
  return '';
}

function chapter() {
  const c = CH[view.ch], x = starsOf(c);
  const tabs = [['sum', '⚡ Summary'], ['notes', '📚 Notes'], ['games', '🎮 Games'], ['stars', '⭐ Stars']];
  let body = '';
  if (view.tab === 'sum') {
    body = `<div class="tools"><button class="pill" onclick="playAll()">▶ Play all</button>
      <button class="pill alt" onclick="startQuiz({ch:'${c.id}'})">🎯 Test me on this chapter</button></div>
      <div id="sumlist">${c.summary.map((s, k) => `<div class="scard ln" data-a="${c.summaryAudio[k].join(',')}"><span class="num">${k + 1}</span><span class="tx">${esc(s)}</span><button class="mini">▶</button></div>`).join('')}</div>`;
  } else if (view.tab === 'notes') {
    body = `<p style="color:#5b5f86;margin:0 2px 12px">All of your notes, topic by topic. Tap ▶ to hear a line, tap again (⏸) to pause. "▶ Listen" reads the whole topic and gives you the 📖 star.</p>` +
      c.topics.map(t => {
        const r = readSet.has(t.id), m = mastered(c, t.id), n = qsOf(c, t.id), nok = n.filter(q => okSet.has(q.id)).length;
        return `<div class="topic ${r && m ? 'done' : ''}" id="t-${t.id}">
          <div class="th"><h3>${esc(t.title)}</h3><div class="tstars"><span>📖${r ? '⭐' : '☆'}</span><span>🎯${m ? '⭐' : '☆'}</span></div></div>
          ${t.blocks.map(blockHtml).join('')}
          <div class="tbtns"><button onclick="listenTopic('${t.id}')">▶ Listen</button>
            <button class="${r ? 'read' : ''}" onclick="toggleRead('${t.id}')">${r ? '✅ Read' : '✓ Mark as read'}</button>
            <button onclick="startQuiz({ch:'${c.id}',topic:'${t.id}'})">🎯 Quiz me (${nok}/${n.length})</button></div></div>`;
      }).join('');
  } else if (view.tab === 'games') {
    const tile = (b, i, title, sub, fn) => `<button class="gt" style="--b:${b}" onclick="${fn}"><span class="i">${i}</span><b>${esc(title)}</b><small>${esc(sub)}</small></button>`;
    body = `<div class="gtiles">
        ${tile('linear-gradient(135deg,#4361ee,#7b2cbf)', '🎯', 'Practice Quiz', `All ${c.quiz.length} questions. Wrong ones come back.`, `startQuiz({ch:'${c.id}'})`)}
        ${tile('linear-gradient(135deg,#ef476f,#b5179e)', '❤️', 'Challenge', '3 lives. How far can you go?', `startChallenge({ch:'${c.id}'})`)}
        ${tile('linear-gradient(135deg,#ffb703,#fb8500)', '🃏', 'Flashcards', `${c.flash.length} cards to flip`, `startFlash('${c.id}')`)}
      </div>
      <div class="ghead">🔗 Match the following</div>
      <div class="gtiles">${c.match.map((m, i) => tile('linear-gradient(135deg,#118ab2,#06d6a0)', '🔗', m.title, `${m.pairs.length} pairs`, `startMatch('${c.id}',${i})`)).join('')}</div>
      <div class="ghead">🧺 Sort it into groups</div>
      <div class="gtiles">${c.sort.map((s, i) => tile('linear-gradient(135deg,#2a9d8f,#80b918)', '🧺', s.title, `${s.items.length} items`, `startSort('${c.id}',${i})`)).join('')}</div>
      ${c.order.length ? `<div class="ghead">🔢 Put in order</div><div class="gtiles">${c.order.map((o, i) => tile('linear-gradient(135deg,#d62828,#f77f00)', '🔢', o.title, `${o.items.length} steps`, `startOrder('${c.id}',${i})`)).join('')}</div>` : ''}`;
  } else {
    body = trackerBox(x, c.subject + ' stars') + checklist(c);
  }
  app.innerHTML = topBar(c, c.subject, c.title, `<span class="chip">⭐ ${x.got}/${x.total}</span>`) +
    `<div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${view.tab === k ? 'on' : ''}" onclick="go({name:'ch',ch:'${c.id}',tab:'${k}'})">${l}</button>`).join('')}</div>${body}`;
}

function checklist(c) {
  return c.topics.map(t => {
    const r = readSet.has(t.id), n = qsOf(c, t.id), nok = n.filter(q => okSet.has(q.id)).length, m = nok === n.length;
    return `<div class="check"><span class="s">${r && m ? '🌟' : r || m ? '⭐' : '☆'}</span>
      <div class="ct">${esc(t.title)}<small>📖 ${r ? 'Read ✓' : 'Not read yet'} · 🎯 ${nok}/${n.length} correct</small></div>
      <button onclick="goTopic('${c.id}','${t.id}')">📖 Read</button><button onclick="startQuiz({ch:'${c.id}',topic:'${t.id}'})">🎯 Quiz</button></div>`;
  }).join('');
}
function goTopic(cid, tid) {
  go({name: 'ch', ch: cid, tab: 'notes'});
  setTimeout(() => { const el = document.getElementById('t-' + tid); if (el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 50);
}
function tracker() {
  app.innerHTML = topBar(null, 'Check your coverage', 'Star Tracker') + trackerBox(allStars(), 'All chapters') +
    D.chapters.map(c => { const x = starsOf(c); return `<div class="ghead" style="font-size:18px">${c.emoji} ${c.subject}: ${esc(c.title)} · ⭐ ${x.got}/${x.total}</div>${checklist(c)}`; }).join('');
}
function revision() {
  app.innerHTML = topBar(null, 'Quick review', '⚡ Quick Revision') +
    `<div class="tools"><button class="pill" onclick="playAll()">▶ Play all</button></div><div id="sumlist">` +
    D.chapters.map(c => `<div class="ghead" style="font-size:18px">${c.emoji} ${c.subject}: ${esc(c.title)}</div>` +
      c.summary.map((s, k) => `<div class="scard ln" style="--c1:${c.c1}" data-a="${c.summaryAudio[k].join(',')}"><span class="num" style="background:${c.c1}">${k + 1}</span><span class="tx">${esc(s)}</span><button class="mini">▶</button></div>`).join('')).join('') + `</div>`;
}
function playAll() { playLines([...document.querySelectorAll('#sumlist .ln')]); }
function listenTopic(tid) {
  const card = document.getElementById('t-' + tid);
  playLines([...card.querySelectorAll('.ln')], () => { if (!readSet.has(tid)) { readSet.add(tid); save(); rerender(); confetti(); } });
}
function toggleRead(tid) {
  if (readSet.has(tid)) readSet.delete(tid); else { readSet.add(tid); confetti(); ding(); }
  save(); rerender();
}
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  const em = ['⭐', '🎉', '✨', '🌟', '🎈', '💜'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}

const ov = document.getElementById('ov'), ovb = () => document.getElementById('ovb');
let G = null;
function openOv(title, c) {
  stopAll();
  ov.style.setProperty('--c1', c ? c.c1 : '#4361ee');
  ov.style.setProperty('--c2', c ? c.c2 : '#b5179e');
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = '';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { stopAll(); ov.classList.remove('show'); document.body.style.overflow = ''; G = null; rerender(); }
const setScore = t => document.getElementById('ovs').innerHTML = t;

function pool(o) {
  if (o.all) return D.chapters.flatMap(c => c.quiz.map(q => ({...q, c})));
  const c = CH[o.ch];
  return c.quiz.filter(q => !o.topic || q.topic === o.topic).map(q => ({...q, c}));
}
function quizTitle(o, word) {
  if (o.all) return word + ': All chapters';
  const c = CH[o.ch];
  if (o.topic) return '🎯 ' + c.topics.find(t => t.id === o.topic).title;
  return word + ': ' + c.subject;
}
function startQuiz(o) {
  const list = pool(o);
  G = {mode: 'practice', o, queue: shuffle(list), total: list.length, learned: new Set(), first: 0, missed: new Map()};
  openOv(quizTitle(o, '🎯 Practice'), o.ch ? CH[o.ch] : null);
  showQ();
}
function startChallenge(o) {
  const list = pool(o);
  G = {mode: 'challenge', o, queue: shuffle(list), total: list.length, lives: 3, score: 0, streak: 0, bestStreak: 0, missed: new Map()};
  openOv(quizTitle(o, '❤️ Challenge'), o.ch ? CH[o.ch] : null);
  showQ();
}
const TYPE = {mcq: ['Choose the answer', '#4361ee'], tf: ['True or False', '#06a77d'], fill: ['Fill in the blank', '#7b2cbf']};
function showQ() {
  if (!G.queue.length || (G.mode === 'challenge' && G.lives <= 0)) return quizEnd();
  const q = G.queue[0];
  G.cur = q; G.opts = q.type === 'tf' ? q.opts : shuffle(q.opts); G.answered = false;
  const done = G.mode === 'practice' ? G.learned.size : G.total - G.queue.length;
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(G.lives)}${'🤍'.repeat(3 - G.lives)}</span> · ${G.score}`);
  const qhtml = esc(q.q).replace(/_{3,}/g, '<span class="blank">&nbsp;</span>');
  ovb().innerHTML = `
    <div class="qprog"><div class="bar"><i style="width:${done / G.total * 100}%"></i></div><span>${G.mode === 'practice' ? `${G.learned.size}/${G.total} learned` : `Q ${done + 1}/${G.total} · 🔥 ${G.streak}`}</span></div>
    <div class="qc">
      <span class="badge" style="--bb:${TYPE[q.type][1]}">${TYPE[q.type][0]}</span> <span class="badge" style="--bb:${q.c.c1}">${q.c.emoji} ${q.c.subject}</span>
      <div class="qq"><span>${qhtml}</span><button class="say" onclick="sayText(G.cur.q)">🔊</button></div>
      <div class="opts">${G.opts.map((o, k) => `<button class="opt" onclick="answer(this,${k})">${esc(o)}</button>`).join('')}</div>
      <div id="after"></div>
    </div>`;
  ovb().scrollTop = 0;
}
function answer(btn, k) {
  if (G.answered) return;
  G.answered = true;
  const q = G.queue.shift(), btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  const ok = G.opts[k] === q.a;
  let note;
  if (ok) {
    btn.classList.add('ok');
    okSet.add(q.id); save();
    ding(); confetti();
    if (G.mode === 'practice') { G.learned.add(q.id); if (!G.missed.has(q.id)) G.first++; }
    else { G.score++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    note = `<div class="note good">${['Well done! 🎉', 'Super! 🌟', 'Correct! 💯', 'Brilliant! ✨'][Math.floor(Math.random() * 4)]}</div>`;
  } else {
    btn.classList.add('bad');
    btns.forEach((b, j) => { if (G.opts[j] === q.a) b.classList.add('ok'); });
    G.missed.set(q.id, {q: q.q, a: q.a});
    buzz();
    if (G.mode === 'practice') {
      G.queue.splice(Math.min(G.queue.length, 3 + Math.floor(Math.random() * 3)), 0, q);
      note = `<div class="note bad">The right answer is in green. This question will come back soon 🔁</div>`;
    } else {
      G.lives--; G.streak = 0;
      note = `<div class="note bad">Oops! You lost a life 💔 The right answer is in green.</div>`;
    }
  }
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(Math.max(0, G.lives))}${'🤍'.repeat(3 - Math.max(0, G.lives))}</span> · ${G.score}`);
  document.getElementById('after').innerHTML = note + `<button class="nx" onclick="showQ()">Next ➜</button>`;
}
function quizEnd() {
  const review = [...G.missed.values()];
  let big, msg, line, stars;
  if (G.mode === 'practice') {
    const s = G.first, n = G.total;
    stars = Math.max(1, Math.round(s / n * 5));
    big = s === n ? '🏆' : s >= n * 0.7 ? '🥳' : '💪';
    msg = s === n ? 'Perfect! All correct the first time!' : 'Great! Now you know all of them!';
    line = `${s} of ${n} correct on the first try`;
  } else {
    const key = 'ss8-best-' + (G.o.all ? 'all' : G.o.ch);
    const best = Math.max(+(localStorage.getItem(key) || 0), G.score);
    localStorage.setItem(key, best);
    stars = Math.max(1, Math.round(G.score / G.total * 5));
    big = G.lives > 0 ? '🏆' : '💥';
    msg = G.lives > 0 ? 'You finished with lives left!' : 'Game over! Try to beat your score.';
    line = `Score: ${G.score} · Best streak: 🔥 ${G.bestStreak} · Best score: ${best}`;
  }
  ovb().innerHTML = `<div class="end"><div class="bigem">${big}</div><h2>${msg}</h2><p style="font-size:17px">${line}</p>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)}</div>
    ${review.length ? `<div class="review"><h3>Read these once more:</h3>${review.map(r => `<div>${esc(r.q)}<br><b>✔ ${esc(r.a)}</b></div>`).join('')}</div>` : ''}
    <div class="row2"><button class="nx" onclick="${G.mode === 'practice' ? 'startQuiz' : 'startChallenge'}(G.o)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
  confetti(); ding();
}

function startFlash(cid) {
  const c = CH[cid];
  G = {mode: 'flash', c, deck: shuffle(c.flash), i: 0};
  openOv('🃏 Flashcards: ' + c.subject, c);
  showFlash();
}
function showFlash() {
  const [f, b] = G.deck[G.i];
  setScore(`${G.i + 1} / ${G.deck.length}`);
  ovb().innerHTML = `<p class="mh">Think of the answer, then tap the card to flip it 👆</p>
    <div class="flash" id="fc" onclick="this.classList.toggle('fl')"><div class="in">
      <div class="f fr">${esc(f)}<small>tap to flip</small></div><div class="f bk">${esc(b)}</div></div></div>
    <div class="row2"><button class="nx alt" onclick="G.i=(G.i-1+G.deck.length)%G.deck.length;showFlash()">← Back</button>
      <button class="nx alt" onclick="sayText(G.deck[G.i][0]+'. '+G.deck[G.i][1])">🔊</button>
      <button class="nx" onclick="G.i=(G.i+1)%G.deck.length;showFlash()">Next →</button></div>
    <div class="row2"><button class="nx alt" onclick="G.deck=shuffle(G.deck);G.i=0;showFlash()">🔀 Shuffle</button></div>`;
}

function startMatch(cid, mi) {
  const c = CH[cid], m = c.match[mi];
  const pairs = shuffle(m.pairs.map((p, i) => ({l: p[0], r: p[1], i})));
  const nr = Math.ceil(pairs.length / 5), size = Math.ceil(pairs.length / nr), rounds = [];
  for (let k = 0; k < pairs.length; k += size) rounds.push(pairs.slice(k, k + size));
  G = {mode: 'match', c, cid, mi, m, rounds, r: 0, mistakes: 0};
  openOv('🔗 ' + m.title, c);
  showMatch();
}
function showMatch() {
  const R = G.rounds[G.r];
  G.done = 0; G.sel = null;
  setScore(`Round ${G.r + 1}/${G.rounds.length}`);
  ovb().innerHTML = `<p class="mh">Tap one on the left, then its partner on the right 👆</p><div class="mcols">
    <div class="mcol"><h4>${esc(G.m.left)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickL(this)">${esc(p.l)}</button>`).join('')}</div>
    <div class="mcol"><h4>${esc(G.m.right)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickR(this)">${esc(p.r)}</button>`).join('')}</div></div>`;
}
function pickL(b) {
  if (b.classList.contains('done')) return;
  document.querySelectorAll('.mcol:first-child .mb').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); G.sel = b;
}
function pickR(b) {
  if (b.classList.contains('done')) return;
  if (!G.sel) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); return; }
  if (b.dataset.i === G.sel.dataset.i) {
    [b, G.sel].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
    G.sel = null; G.done++; ding();
    if (G.done === G.rounds[G.r].length) setTimeout(matchEnd, 500);
  } else {
    const s = G.sel; [b, s].forEach(x => x.classList.add('bad'));
    setTimeout(() => { b.classList.remove('bad'); s.classList.remove('bad'); }, 400);
    G.mistakes++; buzz();
  }
}
function matchEnd() {
  const last = G.r + 1 >= G.rounds.length;
  confetti();
  ovb().innerHTML = `<div class="end"><div class="bigem">${last ? '🏆' : '🎉'}</div><h2>${last ? 'All pairs matched!' : 'Round complete!'}</h2>
    ${last ? `<p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>` : ''}
    <div class="row2">${last ? `<button class="nx" onclick="startMatch(G.cid,G.mi)">🔁 Play again</button>` : `<button class="nx" onclick="G.r++;showMatch()">Next round ➜</button>`}
    <button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
}

function startSort(cid, si) {
  const c = CH[cid], s = c.sort[si];
  G = {mode: 'sort', c, cid, si, s, left: shuffle(s.items.map((it, i) => i)), placed: s.buckets.map(() => []), sel: null, mistakes: 0};
  openOv('🧺 ' + s.title, c);
  showSort();
}
function showSort() {
  const s = G.s;
  setScore(`${s.items.length - G.left.length}/${s.items.length}`);
  if (!G.left.length) {
    confetti(); ding();
    ovb().innerHTML = `<div class="end"><div class="bigem">🏆</div><h2>Everything sorted!</h2><p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>
      <div class="row2"><button class="nx" onclick="startSort(G.cid,G.si)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
    return;
  }
  ovb().innerHTML = `<p class="mh">Tap an item, then tap the group it belongs to 👇</p>
    <div class="pool">${G.left.map(i => `<button class="chipb ${G.sel === i ? 'sel' : ''}" data-i="${i}" onclick="G.sel=${i};showSort()">${esc(s.items[i][0])}</button>`).join('')}</div>
    <div class="buckets">${s.buckets.map((b, k) => `<div class="bucket" onclick="dropTo(${k},this)"><h4>${esc(b)}</h4>${G.placed[k].map(i => `<div>${esc(s.items[i][0])}</div>`).join('')}</div>`).join('')}</div>`;
}
function dropTo(k, el) {
  if (G.sel === null) return;
  const i = G.sel;
  if (G.s.items[i][1] === k) {
    G.placed[k].push(i); G.left = G.left.filter(x => x !== i); G.sel = null; ding(); showSort();
  } else {
    G.mistakes++; buzz();
    const chip = document.querySelector(`.chipb[data-i="${i}"]`);
    if (chip) { chip.classList.add('bad'); setTimeout(() => chip.classList.remove('bad'), 400); }
  }
}

function startOrder(cid, oi) {
  const c = CH[cid], o = c.order[oi];
  G = {mode: 'order', c, cid, oi, o, picked: 0, shuf: shuffle(o.items.map((_, i) => i)), mistakes: 0};
  openOv('🔢 ' + o.title, c);
  setScore('');
  ovb().innerHTML = `<div class="qc"><div class="qq"><span>Tap them in the correct order: first one first!</span></div>
    <div class="oans" id="oans"></div>
    <div class="oleft">${G.shuf.map(i => `<button class="opt" data-i="${i}" onclick="pickO(this)">${esc(o.items[i])}</button>`).join('')}</div><div id="after"></div></div>`;
}
function pickO(b) {
  if (+b.dataset.i === G.picked) {
    G.picked++;
    document.getElementById('oans').insertAdjacentHTML('beforeend', `<div>${G.picked}. ${esc(G.o.items[+b.dataset.i])}</div>`);
    b.remove(); ding();
    if (G.picked === G.o.items.length) {
      confetti();
      document.getElementById('after').innerHTML = `<div class="note good">Perfect order! 🎉 Mistakes: ${G.mistakes}</div>
        <div class="row2"><button class="nx" onclick="startOrder(G.cid,G.oi)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div>`;
    }
  } else {
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); G.mistakes++; buzz();
  }
}

render();
</script>
</body>
