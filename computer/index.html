const STORAGE = 'eshan_it_v1';

let store = JSON.parse(localStorage.getItem(STORAGE) || '{}');
const save = () => localStorage.setItem(STORAGE, JSON.stringify(store));

function starFromPct(p) {
  if (p >= 90) return 3;
  if (p >= 70) return 2;
  if (p >= 50) return 1;
  return 0;
}
function starStr(n) { return '★'.repeat(n) + '☆'.repeat(3 - n); }
function rec(id) {
  if (!store[id]) store[id] = { stars: 0, acts: {}, learnDone: false };
  return store[id];
}
function awardStars(id, pct) {
  const r = rec(id);
  const s = starFromPct(pct);
  if (s > r.stars) { r.stars = s; save(); return true; }
  save();
  return false;
}

        left: ['&lt;form&gt;', 'type="password"', 'type="submit"', '&lt;h1&gt;'],
        right: ['Shows main heading', 'Sends the form', 'Hides typed secret', 'Wraps inputs'],
        pairs: [[0,3],[1,2],[2,1],[3,0]] }
    ],
    quiz: [
      { q: 'HTML is used to…', o: ['Structure web pages', 'Only print paper', 'Sort Excel only', 'Connect Bluetooth earbuds only'], a: 0 },
      { q: 'Form action attribute is…', o: ['URL where data is sent', 'Text colour', 'LAN speed', 'Filter condition'], a: 0 },
      { q: 'Form method can be…', o: ['GET or POST', 'PAN or MAN', 'Bus or Ring', 'Only ascending'], a: 0 },
      { q: '&lt;a&gt; tag creates…', o: ['Hyperlinks', 'Excel charts', 'Network cables', 'Conditional formatting'], a: 0 },
      { q: 'href attribute is for…', o: ['Link destination', 'Password hiding', 'Sorting Z-A', 'Mesh count'], a: 0 },
      { q: 'target on &lt;a&gt; can…', o: ['Open link in new tab/window', 'Delete network', 'Filter marks', 'Break backbone'], a: 0 },
      { q: 'Marquee makes content…', o: ['Scroll on the page', 'Sort ascending', 'Share printers', 'Encrypt Wi‑Fi always'], a: 0 },
      { q: 'Login forms often use input type…', o: ['text and password', 'only mesh', 'only WAN', 'only marquee'], a: 0 },
      { q: 'Basic page structure includes…', o: ['html, head, body', 'Only backbone cable', 'Only PAN', 'Only filter'], a: 0 },
      { q: 'Submit button on a form…', o: ['Sends form data to action URL', 'Sorts the sheet', 'Creates LAN', 'Is cyberbullying'], a: 0 }
    ]
  }
];

let view = { page: 'hub', lessonId: null, tab: 'learn' };
let quizRun = null;

function progressStats() {
  let touched = 0, totalStars = 0, maxStars = LESSONS.length * 3;
  LESSONS.forEach(L => {
    const r = rec(L.id);
    if (r.learnDone || r.stars > 0 || Object.keys(r.acts).length) touched++;
    totalStars += r.stars || 0;
  });
  const allQuiz = LESSONS.every(L => rec(L.id).stars >= 1);
  const allMax = LESSONS.every(L => rec(L.id).stars === 3);
  let msg = allMax ? 'win|🚀 Full marks — every topic at 3 stars!' :
    allQuiz ? 'practice|All topics quizzed — aim for 90%+ on each for 3 stars.' :
    'practice|Open each chapter: Learn → Play activities → Quiz.';
  const pct = Math.round((touched / LESSONS.length) * 100);
  return { touched, pct, totalStars, maxStars, msg };
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function topBar(title, sub, chip) {
  return `<div class="top">
    <button type="button" aria-label="Home" onclick="location.href='${HOME}'">🏠</button>
    <button type="button" aria-label="Back" onclick="goBack()">←</button>
    <div class="mid"><small>${esc(sub || 'Class 8 IT')}</small><b>${esc(title)}</b></div>
    ${chip ? `<span class="chip">${chip}</span>` : ''}
  </div>`;
}

window.goBack = function() {
  if (quizRun) { closeQuiz(); return; }
  if (view.page === 'lesson') { view.page = 'hub'; view.lessonId = null; render(); return; }
  if (history.length > 1) history.back();
  else location.href = HOME;
};

function renderHub() {
  const st = progressStats();
  const [mc, mt] = st.msg.split('|');
  const cards = LESSONS.map(L => {
    const r = rec(L.id);
    return `<button type="button" class="lcard" style="--c1:${L.c1};--c2:${L.c2}" onclick="openLesson('${L.id}')">
      <span class="ic">${L.emoji}</span><span class="sub">${esc(L.sub)}</span>
      <h2>${esc(L.title)}</h2>
      <div class="stars">${starStr(r.stars || 0)}</div>
    </button>`;
  }).join('');
  return topBar('Computer / IT', 'Eshan · Class 8', `⭐ ${st.totalStars}/${st.maxStars}`) + `
    <div class="hero"><div class="em">💻</div><h1>Computer &amp; IT</h1><p>Networks · Excel · HTML — interactive notes</p></div>
    <div class="banner">
      <div class="row"><span>Coverage for Mom</span><span>${st.touched}/${LESSONS.length} topics · ${st.totalStars} stars total</span></div>
      <div class="bar"><i style="width:${st.pct}%"></i></div>
      <small>Stars saved in this browser (${STORAGE}). Each quiz: 0–3 stars by score.</small>
      <div class="msg ${mc}">${esc(mt)}</div>
    </div>
    <div class="grid">${cards}</div>`;
}

window.markLearn = function(id) { rec(id).learnDone = true; save(); };

function renderLearn(L) {
  return L.learn.map(c => `
    <div class="lcard2 flip" onclick="this.classList.toggle('open');markLearn('${L.id}')">
      <h3>${c.t}</h3><small>Tap to expand ▼</small>
      <div class="back">${c.b}</div>
    </div>`).join('');
}

function renderActivity(L, act) {
  const r = rec(L.id);
  const done = r.acts[act.id];
  let inner = `<h3>${esc(act.title)}${done ? '<span class="done-tag">Done</span>' : ''}</h3>`;
  if (act.type === 'mcq' || act.type === 'pick') {
    inner += `<p class="qq">${esc(act.q)}</p><div class="opts" id="act-${act.id}">` +
      act.opts.map((o, i) => `<button type="button" class="opt" onclick="actMcq('${L.id}','${act.id}',${i},${act.a})">${esc(o)}</button>`).join('') +
      `</div><div id="feed-${act.id}"></div>`;
  } else if (act.type === 'fill') {
    inner += `<p class="qq">${esc(act.q)}</p><input class="inp" id="inp-${act.id}" placeholder="Answer">
      <button type="button" class="pill cyan" onclick="actFill('${L.id}','${act.id}')">Check</button><div id="feed-${act.id}"></div>`;
  } else if (act.type === 'match') {
    inner += `<div class="mh">Match pairs — tap one from each column</div><div class="mcols" id="match-${act.id}">
      <div class="mcol"><h4>Left</h4>${act.left.map((t,i)=>`<button type="button" class="mb" data-side="L" data-i="${i}" onclick="matchPick('${L.id}','${act.id}',this)">${esc(t)}</button>`).join('')}</div>
      <div class="mcol"><h4>Right</h4>${act.right.map((t,i)=>`<button type="button" class="mb" data-side="R" data-i="${i}" onclick="matchPick('${L.id}','${act.id}',this)">${esc(t)}</button>`).join('')}</div>
    </div><div id="feed-${act.id}"></div>`;
    window['_match_'+act.id] = { pairs: act.pairs, sel: null, matched: new Set() };
  }
  return `<div class="act">${inner}</div>`;
}

window.actMcq = function(lid, aid, pick, ans) {
  const box = document.getElementById('act-' + aid);
  if (!box || box.dataset.lock) return;
  const ok = pick === ans;
  box.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if (i === ans) b.classList.add('ok');
    else if (i === pick) b.classList.add('bad');
  });
  box.dataset.lock = '1';
  document.getElementById('feed-' + aid).innerHTML = `<div class="feed ${ok ? 'good' : 'bad'}">${ok ? 'Correct!' : 'Check the Learn tab and try again.'}</div>`;
  if (ok) { rec(lid).acts[aid] = true; save(); setTimeout(render, ok ? 400 : 0); }
};

window.actFill = function(lid, aid) {
  const act = LESSONS.find(x => x.id === lid).activities.find(a => a.id === aid);
  const v = (document.getElementById('inp-' + aid).value || '').trim().toLowerCase();
  const ok = act.answers.some(a => a.toLowerCase() === v);
  document.getElementById('feed-' + aid).innerHTML = `<div class="feed ${ok ? 'good' : 'bad'}">${ok ? 'Correct!' : 'Answer: ' + act.answers[0]}</div>`;
  if (ok) { rec(lid).acts[aid] = true; save(); setTimeout(render, 500); }
};

window.matchPick = function(lid, aid, el) {
  const st = window['_match_' + aid];
  if (!st || el.classList.contains('done')) return;
  const side = el.dataset.side, idx = +el.dataset.i;
  if (!st.sel) { st.sel = { side, idx, el }; el.classList.add('sel'); return; }
  if (st.sel.side === side) {
    st.sel.el.classList.remove('sel');
    st.sel = { side, idx, el }; el.classList.add('sel'); return;
  }
  const leftIdx = side === 'L' ? idx : st.sel.idx;
  const rightIdx = side === 'R' ? idx : st.sel.idx;
  const pairOk = st.pairs.some(p => p[0] === leftIdx && p[1] === rightIdx);
  st.sel.el.classList.remove('sel');
  if (pairOk) { el.classList.add('done'); st.sel.el.classList.add('done'); st.matched.add(leftIdx+'-'+rightIdx); }
  else { el.classList.add('bad'); st.sel.el.classList.add('bad'); setTimeout(()=>{ el.classList.remove('bad'); st.sel.el.classList.remove('bad'); }, 450); }
  st.sel = null;
  const act = LESSONS.find(x => x.id === lid).activities.find(a => a.id === aid);
  if (st.matched.size === act.pairs.length) {
    document.getElementById('feed-' + aid).innerHTML = '<div class="feed good">All matched! ✅</div>';
    rec(lid).acts[aid] = true; save();
  }
};

function renderLesson() {
  const L = LESSONS.find(x => x.id === view.lessonId);
  if (!L) return renderHub();
  const r = rec(L.id);
  const tabs = ['learn','play','quiz'].map(t =>
    `<button type="button" class="tab${view.tab===t?' on':''}" onclick="setTab('${t}')">${t==='learn'?'📖 Learn':t==='play'?'🎮 Play':'✅ Quiz'}</button>`).join('');
  let body = '';
  if (view.tab === 'learn') body = `<div class="learn">${renderLearn(L)}</div>`;
  if (view.tab === 'play') body = L.activities.map(a => renderActivity(L, a)).join('');
  if (view.tab === 'quiz') body = `<div class="quizbox"><p>10 MCQs cover every note point in this topic.</p>
    <p>Best stars: <b>${starStr(r.stars || 0)}</b></p>
    <button type="button" class="pill cyan" onclick="startQuiz('${L.id}')">Start quiz</button></div>`;
  return topBar(L.title, L.sub, starStr(r.stars || 0)) + `<div class="tabs">${tabs}</div>${body}`;
}

window.openLesson = function(id) { view.page = 'lesson'; view.lessonId = id; view.tab = 'learn'; render(); };
window.setTab = function(t) { view.tab = t; render(); };

window.startQuiz = function(lid) {
  const L = LESSONS.find(x => x.id === lid);
  quizRun = { lid, i: 0, score: 0, total: L.quiz.length };
  document.getElementById('quiz-ov').classList.add('show');
  renderQuizQ();
};

function renderQuizQ() {
  const L = LESSONS.find(x => x.id === quizRun.lid);
  const q = L.quiz[quizRun.i];
  document.getElementById('quiz-body').innerHTML = `
    <div class="qhead"><span>Q ${quizRun.i+1}/${quizRun.total}</span><span>Score ${quizRun.score}</span></div>
    <div class="bar"><i style="width:${Math.round(quizRun.i/quizRun.total*100)}%"></i></div>
    <div class="qq">${esc(q.q)}</div>
    <div class="opts" id="q-opts">${q.o.map((t,i)=>`<button type="button" class="opt" onclick="quizPick(${i},${q.a})">${esc(t)}</button>`).join('')}</div>
    <div id="q-feed"></div>`;
}

window.quizPick = function(pick, ans) {
  const box = document.getElementById('q-opts');
  if (!box || box.dataset.lock) return;
  if (pick === ans) quizRun.score++;
  box.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(i===ans)b.classList.add('ok'); else if(i===pick)b.classList.add('bad'); });
  box.dataset.lock='1';
  document.getElementById('q-feed').innerHTML = `<button type="button" class="pill" onclick="quizNext()">${quizRun.i+1>=quizRun.total?'Results':'Next'}</button>`;
};

window.quizNext = function() {
  quizRun.i++;
  if (quizRun.i >= quizRun.total) { renderQuizEnd(); return; }
  renderQuizQ();
};

function renderQuizEnd() {
  const pct = Math.round(quizRun.score / quizRun.total * 100);
  const stars = starFromPct(pct);
  const improved = awardStars(quizRun.lid, pct);
  document.getElementById('quiz-body').innerHTML = `
    <div class="end"><div class="big">${stars>=2?'🏆':'📚'}</div><h2>Done!</h2>
    <p>${quizRun.score}/${quizRun.total} (${pct}%)</p><div class="stars">${starStr(stars)}</div>
    <p>${improved?'Saved new best stars!':'Practice again for higher stars.'}</p>
    <button type="button" class="pill" onclick="closeQuiz()">Back</button>
    <button type="button" class="pill cyan" onclick="startQuiz('${quizRun.lid}')">Retry</button></div>`;
}

window.closeQuiz = function() {
  document.getElementById('quiz-ov').classList.remove('show');
  quizRun = null; render();
};

function render() {
  document.getElementById('root').innerHTML = view.page === 'hub' ? renderHub() : renderLesson();
}

document.body.insertAdjacentHTML('beforeend', `<div class="ov" id="quiz-ov"><div class="ovtop">
<button type="button" onclick="closeQuiz()">×</button><div class="t">Topic quiz</div></div>
<div style="flex:1;overflow:auto;padding:16px;max-width:820px;margin:0 auto;width:100%" id="quiz-body"></div></div>`);

render();
</script>
</body>
</html>
