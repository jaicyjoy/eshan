<!doctype html>
<html lang="en">
<head>

<title>Dictation</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#1f2340;background:linear-gradient(180deg,#e8f1ff 0%,#f6efff 50%,#fff6e8 100%);min-height:100vh;line-height:1.45}
button,input{font-family:inherit}
#app{max-width:880px;margin:0 auto;padding:14px 14px 70px}
.top{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.12)}
.top a,.top button.icon{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#333;flex:none;cursor:pointer}
.top .tt{flex:1;min-width:0}
.top .tt small{display:block;font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase}
.top .tt b{display:block;font-size:19px;line-height:1.2}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.slow{border:0;border-radius:99px;padding:7px 10px;font-weight:800;font-size:14px;background:rgba(255,255,255,.25);color:#fff;cursor:pointer}
.slow.on{background:#ffd60a;color:#3a2b00}
.hero{text-align:center;padding:18px 8px 8px}
.hero .big{font-size:56px}
.hero h1{margin:4px 0 0;font-size:30px;color:var(--c2)}
.hero p{margin:4px 0 0;color:#5b5f86}
.starbox{background:#fff;border-radius:22px;padding:14px 16px;margin:12px 0;box-shadow:0 6px 0 #e3e0f7}
.starbox .row{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.bar{height:14px;background:#ece9fb;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd60a,#06d6a0);border-radius:99px;transition:width .4s}
.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
.gt{border:0;border-radius:20px;padding:16px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer}
.gt .i{font-size:32px;display:block}
.gt b{display:block;font-size:18px;margin-top:4px}
.gt small{display:block;opacity:.95;font-size:13px}
.sec{background:#fff;border-radius:22px;padding:14px;margin-top:14px;box-shadow:0 6px 0 #e6e3f7}
.sec h3{margin:0 0 10px;color:var(--c2)}
.wlist{display:flex;flex-wrap:wrap;gap:8px}
.wlist button{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:99px;padding:8px 12px;font-size:16px;font-weight:700;cursor:pointer;color:var(--c2)}
.wlist button.got{background:#c9f7d6;border-color:#2fbf71}
.wlist button.playing{background:#fff1b8;border-color:#ffb703}
.foot{text-align:center;margin-top:18px;font-size:14px;color:#6b6f93}
.foot a{color:#4361ee;font-weight:700}

.ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;background:linear-gradient(160deg,#eef0ff,#fff0f7 55%,#fff8e6)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2))}
.ovtop button{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;font-weight:900;cursor:pointer}
.ovtop .t{flex:1;font-weight:800;font-size:17px}
.ovtop .sc{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-weight:800}
.ovb{flex:1;overflow-y:auto;padding:16px 14px 40px;max-width:820px;width:100%;margin:0 auto}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 7px 0 #e6e3f7;text-align:center}
.say{border:0;width:78px;height:78px;border-radius:50%;font-size:34px;background:#efeaff;cursor:pointer}
.say.playing{background:#ffb703}
.clue{margin-top:10px;font-size:17px;font-weight:700;color:#5b5f86}
.slots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:16px 0;min-height:40px}
.slot{min-width:28px;height:42px;border-bottom:4px solid #b9a8ff;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center}
.slot.space{border:0;min-width:12px;color:#bbb}
.slot.f{color:#1f9d55;border-color:#2fbf71}
.typein{display:block;width:100%;max-width:420px;margin:12px auto 0;font-size:26px;font-weight:800;text-align:center;padding:12px;border:4px solid #b9a8ff;border-radius:16px}
.typein.ok{border-color:#2fbf71;background:#e7fbef}
.typein.bad{border-color:#e5484d;animation:shake .35s}
.opts{display:grid;gap:10px;margin-top:14px;text-align:left}
.opt{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:16px;padding:12px 14px;font-size:18px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #e3e0f7}
.opt.ok{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71}
.opt.bad{background:#ffd3d3;border-color:#e5484d;box-shadow:0 4px 0 #e5484d;animation:shake .35s}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.fb{margin-top:12px;font-weight:800;font-size:18px}
.fb.good{color:#1f9d55}.fb.bad{color:#d9480f}
.nx{display:inline-block;margin:14px 6px 0;border:0;border-radius:99px;padding:12px 28px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.nx.alt{background:#fff;color:var(--c1);border:2px solid #cfd6ff;box-shadow:0 5px 0 #e3e0f7}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:800;color:#4a4f7a}
.prog .bar{flex:1;margin:0}
.end{text-align:center}
.end .big{font-size:64px}
.end h2{margin:4px 0;color:var(--c2)}
.stars{font-size:36px;letter-spacing:3px}
.modes{display:grid;gap:10px;max-width:420px;margin:12px auto 0}
.conf{position:fixed;top:-30px;font-size:28px;pointer-events:none;z-index:60;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(480deg);opacity:.5}}
.hi .typein,.hi .opt,.hi .wlist button,.hi .slot{font-family:"Noto Sans Devanagari","Mangal","Kohinoor Devanagari",system-ui,sans-serif}
@media(max-width:560px){.typein{font-size:22px}.opt{font-size:16px}}
</style>
</head>

, ["en-w-beacon", "beacon"], ["en-w-etched", "etched"], ["en-w-valour", "valour"], ["en-w-infiltrators", "infiltrators"], ["en-w-annex", "annex"], ["en-w-combat", "combat"], ["en-w-unfounded", "unfounded"], ["en-w-eerily", "eerily"], ["en-w-outnumbered", "outnumbered"], ["en-w-tenacity", "tenacity"], ["en-w-unparalleled", "unparalleled"], ["en-w-magazines", "magazines"], ["en-w-ammunition", "ammunition"], ["en-w-crouched", "crouched"], ["en-w-conspicuous", "conspicuous"], ["en-w-posthumously", "posthumously"], ["en-w-legacy", "legacy"], ["en-w-testament", "testament"], ["en-w-dispatches", "dispatches"], ["en-w-forged", "forged"], ["en-w-poignant", "poignant"], ["en-w-nickname", "nickname"], ["en-w-in-a-matter-of-fact-manner", "in a matter of fact manner"], ["en-w-hold-ups", "hold-ups"], ["en-w-nursery", "nursery"], ["en-w-testify", "testify"], ["en-w-hunch", "hunch"], ["en-w-loot", "loot"], ["en-w-stroke", "stroke"], ["en-w-will", "will"], ["en-w-leafed-through", "leafed through"], ["en-w-confessed", "confessed"], ["en-w-code", "code"], ["en-w-foreseen", "foreseen"]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const M = D.meta, WORDS = D.words, TXT = Object.fromEntries(D.voice);
document.title = M.emoji + ' ' + M.title + ' · Class 8';
document.body.style.setProperty('--c1', M.c1);
document.body.style.setProperty('--c2', M.c2);
if (M.lang === 'hi') document.body.classList.add('hi');
document.documentElement.lang = M.lang === 'hi' ? 'hi' : 'en';

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const SKEY = 'eshan-dict-' + M.kind;
const S = JSON.parse(localStorage.getItem(SKEY) || '{}');
let slow = localStorage.getItem(SKEY + '-slow') === '1';
const award = (w, n) => { const p = S[w] || 0; if (n > p) { S[w] = n; localStorage.setItem(SKEY, JSON.stringify(S)); return true; } return false; };
const starStr = n => '⭐'.repeat(n) + '☆'.repeat(3 - n);
const gotStars = () => WORDS.reduce((s, x) => s + (S[x.w] || 0), 0);
const totalStars = () => WORDS.length * 3;

const sp = new Audio();
let ptok = 0;
const rate = () => slow ? 0.75 : 1;
function stopAudio() { ptok++; sp.pause(); document.querySelectorAll('.playing').forEach(e => e.classList.remove('playing')); }
function play(id, el) {
  stopAudio();
  const mine = ptok;
  if (el) el.classList.add('playing');
  return new Promise(res => {
    let remote = false;
    const tl = M.lang === 'hi' ? 'hi' : 'en-IN';
    sp.onended = () => { if (el && mine === ptok) el.classList.remove('playing'); res(mine === ptok); };
    sp.onerror = () => {
      if (mine !== ptok || remote) return res(false);
      remote = true;
      const t = TXT[id] || '';
      sp.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=' + tl + '&q=' + encodeURIComponent(t);
      sp.defaultPlaybackRate = sp.playbackRate = rate();
      sp.play().catch(() => {});
    };
    sp.src = 'voice/' + id + '.mp3';
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
function toggleSlow() {
  slow = !slow;
  localStorage.setItem(SKEY + '-slow', slow ? '1' : '0');
  sp.defaultPlaybackRate = sp.playbackRate = rate();
  document.querySelectorAll('.slow').forEach(b => b.classList.toggle('on', slow));
}

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  const em = ['⭐', '🎉', '✨', '🌟', '🎈'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2000);
  }
}
const praise = () => (M.lang === 'hi'
  ? ['शाबाश! 🌟', 'बहुत बढ़िया! 🎉', 'सही जवाब! 💯', 'सुपर! ✨']
  : ['Well done! 🌟', 'Super! 🎉', 'Correct! 💯', 'Brilliant! ✨'])[Math.floor(Math.random() * 4)];

function home() {
  const g = gotStars(), t = totalStars(), pct = t ? Math.round(g / t * 100) : 0;
  app.innerHTML = `
    <div class="top">
      <a class="icon" href="../../index.html" title="Home">🏠</a>
      <button type="button" class="icon" onclick="history.back()" title="Back">←</button>
      <div class="tt"><small>${M.subject} · Class 8</small><b>${M.emoji} ${esc(M.title)}</b></div>
      <span class="chip">⭐ ${g}/${t}</span>
      <button class="slow ${slow ? 'on' : ''}" onclick="toggleSlow()">🐢 Slow</button>
    </div>
    <div class="hero"><div class="big">${M.emoji}</div>
      <h1>${esc(M.title)}</h1>
      <p>${M.lang === 'hi' ? 'क्रम: फ्लैश → चुनो → लिखो' : 'Order: Flash → Pick spelling → Type'}</p>
    </div>
    <div class="starbox"><div class="row"><span>⭐ ${M.lang === 'hi' ? 'मेरे सितारे' : 'My stars'}</span><span>${g} / ${t} · ${pct}%</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="gtiles">
      <button class="gt" style="--b:linear-gradient(135deg,#ff9f1c,#e76f51)" onclick="startDrill('flash')">
        <span class="i">🃏</span><b>${M.lang === 'hi' ? '1 · फ्लैशकार्ड' : '1 · Letter flash'}</b>
        <small>${M.lang === 'hi' ? 'सुनो, फिर शब्द देखो' : 'Listen first, then reveal the word'}</small>
      </button>
      <button class="gt" style="--b:linear-gradient(135deg,#06d6a0,#118ab2)" onclick="startDrill('mcq')">
        <span class="i">🎯</span><b>${M.lang === 'hi' ? '2 · सही शब्द चुनो' : '2 · Pick the spelling'}</b>
        <small>${M.lang === 'hi' ? 'सुनो और सही विकल्प चुनो' : 'Hear it, then choose the correct word'}</small>
      </button>
      <button class="gt" style="--b:linear-gradient(135deg,#4361ee,#7b2cbf)" onclick="startDrill('type')">
        <span class="i">⌨️</span><b>${M.lang === 'hi' ? '3 · लिखकर अभ्यास' : '3 · Type dictation'}</b>
        <small>${M.lang === 'hi' ? 'सुनो और लिखो (असली टेस्ट जैसा)' : 'Listen and type (like the real test)'}</small>
      </button>
      ${M.lang === 'hi' ? `<a class="gt" style="--b:linear-gradient(135deg,#ef476f,#b5179e);display:block" href="../../hindi-revision/">
        <span class="i">📕</span><b>पूरा हिंदी रिवीज़न</b>
        <small>Malhar / earlier Class 8 Hindi app</small>
      </a>` : ''}
    </div>
    <div class="sec"><h3>📋 ${M.lang === 'hi' ? 'सभी शब्द — सुनने के लिए टैप करो' : 'All words — tap to hear'}</h3>
      <div class="wlist">${WORDS.map(x => `<button class="${S[x.w] >= 3 ? 'got' : ''}" onclick="play('${x.vid}',this)">${esc(x.w)} ${'⭐'.repeat(S[x.w] || 0)}</button>`).join('')}</div>
    </div>
    <p class="foot">Bookmark: <b>.../${M.kind === 'en' ? 'english' : 'hindi'}/</b></p>`;
}

const ov = document.getElementById('ov'), ovb = () => document.getElementById('ovb');
let G = null;
function openOv(title) {
  stopAudio();
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = '';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { stopAudio(); ov.classList.remove('show'); document.body.style.overflow = ''; G = null; home(); }
const setScore = t => document.getElementById('ovs').innerHTML = t;

function startDrill(mode) {
  G = {mode, queue: shuffle(WORDS), i: 0, got: 0, total: WORDS.length};
  const titles = {
    type: M.lang === 'hi' ? '⌨️ लिखकर अभ्यास' : '⌨️ Type dictation',
    mcq: M.lang === 'hi' ? '🎯 सही शब्द चुनो' : '🎯 Pick the spelling',
    flash: M.lang === 'hi' ? '🃏 फ्लैशकार्ड' : '🃏 Flash listen',
  };
  openOv(titles[mode]);
  if (mode === 'flash') showFlash();
  else showQ();
}

function showQ() {
  if (G.i >= G.queue.length) return endRound();
  const x = G.queue[G.i];
  G.miss = 0; G.fin = false;
  setScore(`${G.i + 1}/${G.total} · ⭐ ${G.got}`);
  const pct = G.i / G.total * 100;
  let body;
  if (G.mode === 'type') {
    body = `<button class="say" onclick="play('${x.vid}',this)">🔊</button>
      <div class="clue">💡 ${esc(x.clue)}</div>
      <div class="slots">${x.w.split('').map((ch, i) => `<div class="slot${ch === ' ' ? ' space' : ''}" id="sl${i}">${ch === ' ' ? '·' : ''}</div>`).join('')}</div>
      <input class="typein" id="tin" autocomplete="off" autocapitalize="none" spellcheck="false"
        placeholder="${M.lang === 'hi' ? 'यहाँ लिखो…' : 'type here…'}"
        onkeydown="if(event.key==='Enter')checkType()">
      <div><button class="nx" onclick="checkType()">✔ ${M.lang === 'hi' ? 'जाँचो' : 'Check'}</button>
      <button class="nx alt" onclick="play('${x.vid}')">🔁 ${M.lang === 'hi' ? 'फिर सुनो' : 'Hear again'}</button></div>
      <div id="after"></div>`;
  } else {
    body = `<button class="say" onclick="play('${x.vid}',this)">🔊</button>
      <div class="clue">💡 ${esc(x.clue)}</div>
      <p class="clue">${M.lang === 'hi' ? 'कौन-सा शब्द सही है?' : 'Which spelling is correct?'}</p>
      <div class="opts">${shuffle(x.opts).map(o => `<button class="opt" data-w="${esc(o)}" onclick="pickOpt(this)">${esc(o)}</button>`).join('')}</div>
      <div><button class="nx alt" onclick="play('${x.vid}')">🔁 ${M.lang === 'hi' ? 'फिर सुनो' : 'Hear again'}</button></div>
      <div id="after"></div>`;
  }
  ovb().innerHTML = `<div class="prog"><div class="bar"><i style="width:${pct}%"></i></div><span>${G.i + 1}/${G.total}</span></div><div class="card">${body}</div>`;
  play(x.vid);
  if (G.mode === 'type') setTimeout(() => { const t = document.getElementById('tin'); if (t) t.focus(); }, 100);
}

function fillSlots(w) {
  w.split('').forEach((ch, i) => {
    const el = document.getElementById('sl' + i);
    if (el) { el.textContent = ch === ' ' ? '·' : ch; el.classList.add('f'); }
  });
}
function checkType() {
  if (!G || G.fin) return;
  const x = G.queue[G.i], inp = document.getElementById('tin');
  const v = inp.value.trim().toLowerCase().replace(/\s+/g, ' ');
  const want = x.w.toLowerCase().replace(/\s+/g, ' ');
  if (v === want) {
    inp.classList.add('ok'); fillSlots(x.w); finishWord(true);
  } else {
    G.miss++; buzz(); inp.classList.add('bad');
    setTimeout(() => inp.classList.remove('bad'), 400);
    let k = 0; while (k < v.length && k < want.length && v[k] === want[k]) k++;
    document.getElementById('after').innerHTML = `<div class="fb bad">${M.lang === 'hi' ? 'फिर कोशिश करो 💪' : 'Not yet — try again 💪'}${k ? (M.lang === 'hi' ? ` (पहले ${k} अक्षर सही)` : ` (first ${k} letter${k > 1 ? 's' : ''} right)`) : ''}</div>`;
  }
}
function pickOpt(btn) {
  if (!G || G.fin) return;
  const x = G.queue[G.i], chosen = btn.getAttribute('data-w');
  document.querySelectorAll('.opt').forEach(b => b.disabled = true);
  if (chosen === x.w) {
    btn.classList.add('ok'); finishWord(true);
  } else {
    G.miss++; buzz(); btn.classList.add('bad');
    document.querySelectorAll('.opt').forEach(b => { if (b.textContent === x.w) b.classList.add('ok'); });
    document.getElementById('after').innerHTML = `<div class="fb bad">${M.lang === 'hi' ? 'सही शब्द हरा है।' : 'The green one is right.'}</div>
      <button class="nx" onclick="finishWord(false);G.i++;showQ()">Next ➜</button>`;
  }
}
function finishWord(okFirst) {
  if (G.fin) return;
  G.fin = true;
  const x = G.queue[G.i];
  const stars = G.miss === 0 ? 3 : G.miss <= 2 ? 2 : 1;
  G.got += stars;
  const nb = award(x.w, stars);
  ding(); if (stars === 3) confetti();
  setScore(`${G.i + 1}/${G.total} · ⭐ ${G.got}`);
  document.getElementById('after').innerHTML = `<div class="stars">${starStr(stars)}</div>
    <div class="fb good">${praise()}${nb ? (M.lang === 'hi' ? ' · नया बेस्ट!' : ' · New best!') : ''}</div>
    <div style="margin-top:8px;font-size:22px;font-weight:900;color:var(--c2)">${esc(x.w)}</div>
    <button class="nx" onclick="G.i++;showQ()">Next ➜</button>`;
}

function showFlash() {
  if (G.i >= G.queue.length) return endRound();
  const x = G.queue[G.i];
  setScore(`${G.i + 1}/${G.total}`);
  ovb().innerHTML = `<div class="prog"><div class="bar"><i style="width:${G.i / G.total * 100}%"></i></div></div>
    <div class="card">
      <button class="say" onclick="play('${x.vid}',this)">🔊</button>
      <div class="clue">💡 ${esc(x.clue)}</div>
      <p class="clue">${M.lang === 'hi' ? 'सोचो, फिर शब्द देखो' : 'Think of the spelling, then reveal'}</p>
      <div id="reveal" style="display:none;margin-top:16px;font-size:32px;font-weight:900;color:var(--c2)">${esc(x.w)}</div>
      <div id="after"><button class="nx" onclick="document.getElementById('reveal').style.display='';play('${x.vid}');document.getElementById('after').innerHTML='<button class=\\'nx\\' onclick=\\'award(G.queue[G.i].w,3);G.got+=3;G.i++;showFlash()\\'>✅ ${M.lang === 'hi' ? 'अगला' : 'I know it'} ➜</button><button class=\\'nx alt\\' onclick=\\'G.i++;showFlash()\\'>${M.lang === 'hi' ? 'फिर से' : 'Again later'}</button>'">👀 ${M.lang === 'hi' ? 'शब्द दिखाओ' : 'Show word'}</button></div>
    </div>`;
  play(x.vid);
}

function endRound() {
  const max = G.total * 3;
  const s = G.got >= max ? 3 : G.got >= max * 0.7 ? 2 : 1;
  confetti(); ding();
  ovb().innerHTML = `<div class="card end"><div class="big">${s === 3 ? '🏆' : '🥳'}</div>
    <h2>${M.lang === 'hi' ? 'अभ्यास पूरा!' : 'Practice complete!'}</h2>
    <p style="font-size:18px">⭐ ${G.got} / ${max}</p>
    <div class="stars">${starStr(s)}</div>
    <div><button class="nx" onclick="startDrill(G.mode)">🔁 ${M.lang === 'hi' ? 'फिर खेलो' : 'Play again'}</button>
    <button class="nx alt" onclick="closeOv()">✕ ${M.lang === 'hi' ? 'बंद करो' : 'Close'}</button></div></div>`;
}

home();
</script>
</body>
</html>
