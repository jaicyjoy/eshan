h is lost"],"a":0},{"q":"അച്ചടക്കത്തോടെ എന്ത് ചെയ്യണം?","options":["Keep discipline and speak truth","Betray friends","Pollute rivers","Leave school"],"a":0}]},{"title":"പരിസ്ഥിതിയുടെ നാദം","text":"പച്ചപ്പ് കാത്ത്, നദി തെളിഞ്ഞ് ഒഴുകട്ടെ,\nമരം നട്ട്, ആകാശം നീലമാക്കട്ടെ.\nപരിസ്ഥിതി ജീവിതത്തിന്റെ കീലാണ്,\nആരോഗ്യവും സന്തോഷവും അതിൽ നിറയട്ടെ.\n\nകുഴിച്ചിൽ ഇടരുത്, ഭൂമിയെ സ്നേഹിക്കണം,\nപ്രകൃതി സംരക്ഷിക്കണം, നമ്മൾ മറക്കരുത്.","questions":[{"q":"നദിയെക്കുറിച്ച് കവിതാ എന്ത് പറയുന്നു?","options":["Let the river flow clear and clean","Cut all trees","Pollute water","Close schools"],"a":0},{"q":"പരിസ്ഥിതിയെ എന്തായി വിശേഷിപ്പിച്ചു?","options":["Key to life","Source of betrayal","Sign of laziness","Enemy of health"],"a":0},{"q":"ഭൂമിയോട് എന്ത് ചെയ്യണം?","options":["Love the earth; do not litter","Burn plants","Waste water","Ignore health"],"a":0},{"q":"ആരോഗ്യം എന്തുമായി ബന്ധപ്പെട്ടിരിക്കുന്നു?","options":["Protecting nature and environment","Cheating in exams","No discipline","Avoiding friendship"],"a":0}]}]}</script>

  const starSum = modes.reduce((s, id) => s + getStar(id), 0);
  const allGood = modes.every(id => getStar(id) >= 2);
  if (triedAll && allGood) return { cls: 'great', text: '🎉 എല്ലാ ഭാഗവും — നല്ല നക്ഷത്രങ്ങൾ! നിങ്ങൾ നന്നായി വായിക്കുന്നു.' };
  if (triedAll) return { cls: 'ok', text: '✅ എല്ലാ ഭാഗവും ശ്രമിച്ചു. ദുർബല മോഡ് വീണ്ടും ചെയ്യുക.' };
  if (starSum >= 8) return { cls: 'great', text: '🌟 നല്ല നക്ഷത്രങ്ങൾ! ബാക്കി ഭാഗങ്ങൾ പൂർത്തിയാക്കുക.' };
  const any = modes.some(id => store.tried[id]);
  if (any) return { cls: 'practice', text: '📚 കൂടുതൽ പരിശീലനം — വീണ്ടും വായിച്ച് 3 നക്ഷത്രം നേടുക.' };
  return { cls: 'start', text: '👋 നിങ്ങൾ തന്നെ വായിക്കുക, പിന്നെ ഉത്തരം തിരഞ്ഞെടുക്കുക. സ്പീക്കർ ഇല്ല!' };
}

function home() {
  const b = coverageBanner();
  const modes = D.modes;
  const starSum = modes.reduce((s, m) => s + getStar(m.id), 0);
  app.innerHTML = `
    <div class="top">
      <a href="../../index.html" title="Home">🏠</a>
      <button type="button" class="ib" onclick="history.back()" title="Back">←</button>
      <div class="tt"><small>${esc(M.grade)}</small><b>${M.emoji} ${esc(M.title)}</b></div>
      <span class="chip">${starSum}/${modes.length * 3}★</span>
    </div>
    <div class="hero"><div class="big">${M.emoji}</div><h1>${esc(M.title)}</h1><p>Silent reading · നിങ്ങൾ വായിക്കുക, ഉത്തരം നൽകുക</p></div>
    <div class="banner ${b.cls}">${esc(b.text)}</div>
    <div class="hint">💡 ${esc(M.hint)}</div>
    <div class="gtiles">${modes.map(m => `
      <button type="button" class="gt" style="--b:${m.color}" onclick="openMode('${m.id}')">
        <span class="i">${m.emoji}</span><b>${esc(m.title)}</b><small>${esc(m.sub)}</small>
        <span class="st">${starStr(getStar(m.id))}</span>
      </button>`).join('')}</div>`;
}

let G = null;
function openOv(title, score) {
  document.getElementById('ovt').textContent = title;
  document.getElementById('ovs').textContent = score || '';
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeOv() { ov.classList.remove('show'); document.body.style.overflow = ''; G = null; home(); }
function setScore(t) { document.getElementById('ovs').textContent = t; }

function openMode(id) {
  G = { mode: id, correct: 0, total: 0, qi: 0 };
  const m = D.modes.find(x => x.id === id);
  openOv(m.emoji + ' ' + m.title, '');
  if (id === 'words') { G.items = shuffle(D.words); G.i = 0; showWordQ(); }
  else if (id === 'sentences') { G.items = shuffle(D.sentences); G.i = 0; showSentQ(); }
  else if (id === 'passage') showPassagePick();
  else if (id === 'poem') showPoemPick();
}

function showWordQ() {
  if (G.i >= G.items.length) return finishMode('words');
  const item = G.items[G.i];
  const opts = shuffle(item.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${G.i + 1} / ${G.items.length}</div>
    <div class="prompt">ഈ വാക്ക് വായിക്കുക</div>
    <div class="bigtext">${esc(item.w)}</div>
    <div class="prompt">ശരിയായ ഇംഗ്ലീഷ് അർത്ഥം തിരഞ്ഞെടുക്കുക</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt en" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(item.a, () => { G.i++; showWordQ(); });
}

function showSentQ() {
  if (G.i >= G.items.length) return finishMode('sentences');
  const item = G.items[G.i];
  const opts = shuffle(item.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${G.i + 1} / ${G.items.length}</div>
    <div class="prompt">ഈ വാക്യം വായിക്കുക</div>
    <div class="readbox">${esc(item.s)}</div>
    <div class="prompt">ശരിയായ ഇംഗ്ലീഷ് അർത്ഥം തിരഞ്ഞെടുക്കുക</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt en" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(item.a, () => { G.i++; showSentQ(); });
}

function showPassagePick() {
  ovb().innerHTML = `<div class="card">
    <p class="prompt">ഗദ്യം വായിച്ച ശേഷം ചോദ്യങ്ങൾ പരിഹരിക്കുക.</p>
    <div class="pick">
      <button type="button" class="pbtn" onclick="startPassage(0)">📄 ${esc(D.passages[0].title)}<small>3+ ചോദ്യങ്ങൾ</small></button>
      <button type="button" class="pbtn" onclick="startPassage(1)">📄 ${esc(D.passages[1].title)}<small>3+ ചോദ്യങ്ങൾ</small></button>
      <button type="button" class="pbtn" onclick="startPassage('all')">📚 രണ്ട് ഗദ്യവും<small>പൂർണ്ണ പരിശീലനം</small></button>
    </div>
    <div class="navl"><button type="button" class="nx alt" onclick="closeOv()">← Home</button></div>
  </div>`;
}

function startPassage(which) {
  G.passages = which === 'all' ? [0, 1] : [which];
  G.pi = 0; G.correct = 0; G.total = 0; G.qi = 0;
  showPassageRead();
}

function showPassageRead() {
  const p = D.passages[G.passages[G.pi]];
  ovb().innerHTML = `<div class="card">
    <div class="prog">ഗദ്യം ${G.pi + 1} / ${G.passages.length}</div>
    <div class="readbox"><h3>${esc(p.title)}</h3>${esc(p.text)}</div>
    <p style="text-align:center;font-weight:800;color:#5b5f86">ശ്രദ്ധയോടെ വായിച്ച ശേഷം തുടരുക.</p>
    <div class="navl"><button type="button" class="nx" onclick="G.qi=0;showPassageQ()">വായിച്ചു →</button></div>
  </div>`;
}

function showPassageQ() {
  const p = D.passages[G.passages[G.pi]];
  if (G.qi >= p.questions.length) {
    G.pi++;
    if (G.pi >= G.passages.length) return finishMode('passage');
    G.qi = 0;
    return showPassageRead();
  }
  const q = p.questions[G.qi];
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${esc(p.title)} · Q ${G.qi + 1}/${p.questions.length}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt en" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(q.a, () => { G.qi++; showPassageQ(); });
}

function showPoemPick() {
  ovb().innerHTML = `<div class="card">
    <p class="prompt">കവിത വായിച്ച ശേഷം ചോദ്യങ്ങൾ പരിഹരിക്കുക.</p>
    <div class="pick">
      <button type="button" class="pbtn" onclick="startPoem(0)">🎵 ${esc(D.poems[0].title)}<small>3+ ചോദ്യങ്ങൾ</small></button>
      <button type="button" class="pbtn" onclick="startPoem(1)">🎵 ${esc(D.poems[1].title)}<small>3+ ചോദ്യങ്ങൾ</small></button>
      <button type="button" class="pbtn" onclick="startPoem('all')">📚 രണ്ട് കവിതകളും<small>പൂർണ്ണ പരിശീലനം</small></button>
    </div>
    <div class="navl"><button type="button" class="nx alt" onclick="closeOv()">← Home</button></div>
  </div>`;
}

function startPoem(which) {
  G.poems = which === 'all' ? [0, 1] : [which];
  G.pi = 0; G.correct = 0; G.total = 0; G.qi = 0;
  showPoemRead();
}

function showPoemRead() {
  const p = D.poems[G.poems[G.pi]];
  ovb().innerHTML = `<div class="card">
    <div class="prog">കവിത ${G.pi + 1} / ${G.poems.length}</div>
    <div class="readbox poem"><h3>${esc(p.title)}</h3>${esc(p.text)}</div>
    <p style="text-align:center;font-weight:800;color:#5b5f86">ഭാവത്തോടെ വായിച്ച ശേഷം തുടരുക.</p>
    <div class="navl"><button type="button" class="nx" onclick="G.qi=0;showPoemQ()">വായിച്ചു →</button></div>
  </div>`;
}

function showPoemQ() {
  const p = D.poems[G.poems[G.pi]];
  if (G.qi >= p.questions.length) {
    G.pi++;
    if (G.pi >= G.poems.length) return finishMode('poem');
    G.qi = 0;
    return showPoemRead();
  }
  const q = p.questions[G.qi];
  const opts = shuffle(q.options.map((t, i) => ({ t, i })));
  ovb().innerHTML = `<div class="card">
    <div class="prog">${esc(p.title)} · Q ${G.qi + 1}/${p.questions.length}</div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts" id="opts">${opts.map(o => `<button type="button" class="opt en" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
  bindOpts(q.a, () => { G.qi++; showPoemQ(); });
}

function bindOpts(correctIdx, next) {
  let locked = false;
  document.querySelectorAll('#opts .opt').forEach(btn => {
    btn.onclick = () => {
      if (locked) return;
      locked = true;
      const pick = +btn.dataset.i;
      const ok = pick === correctIdx;
      G.total++;
      if (ok) G.correct++;
      document.querySelectorAll('#opts .opt').forEach(b => {
        b.disabled = true;
        if (+b.dataset.i === correctIdx) b.classList.add('ok');
        else if (+b.dataset.i === pick) b.classList.add('bad');
      });
      const fb = document.getElementById('fb');
      fb.className = 'fb ' + (ok ? 'good' : 'bad');
      fb.textContent = ok ? 'ശരി! 🌟' : 'വീണ്ടും വായിച്ച് ഓർമ്മിക്കുക.';
      setScore(G.correct + '/' + G.total);
      setTimeout(next, ok ? 700 : 1200);
    };
  });
}

function finishMode(modeId) {
  markTried(modeId);
  const stars = starsFromAccuracy(G.correct, G.total);
  const improved = setStar(modeId, stars);
  ovb().innerHTML = `<div class="card end">
    <div class="big">${stars >= 2 ? '🏆' : '📗'}</div>
    <h2 style="color:var(--c2);margin:8px 0">Round complete!</h2>
    <p style="font-weight:800;font-size:18px">${G.correct} / ${G.total} correct</p>
    <div class="stars">${starStr(stars)}</div>
    <p style="color:#5b5f86;font-weight:700">${improved ? 'New best stars for this mode!' : 'Keep reading to earn more stars.'}</p>
    <div class="navl">
      <button type="button" class="nx" onclick="openMode('${modeId}')">🔁 Again</button>
      <button type="button" class="nx alt" onclick="closeOv()">← Home</button>
    </div>
  </div>`;
}

home();
</script>
</body>
</html>
